<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" defer></script><script>

const suits='♠♥♦♣', rank=c=>c%13+2,suit=c=>Math.floor(c/13),face=c=>String(rank(c)).replace('14','A').replace('13','K').replace('12','Q').replace('11','J');

function initPoker() {

}
function pokerBotMove() {

  if (table.phase === 'exchange') return Math.random() < .5 ? 'keep' : 0;
  if (table.pressure) return Math.random() < .25 ? 'fold' : 'call';
  return !table.pressed[i] && Math.random() < .3 ? 'press' : 'check';

function nextBJ(){while(G.turn<seats.length&&total(G.hands[G.turn])>=21)G.turn++;if(G.turn<seats.length&&total(G.dealer)!==21)return;while(total(G.dealer)<17)G.dealer.push(G.deck.pop());let d=total(G.dealer),dn=d===21&&G.dealer.length===2;G.end=seats.map((s,i)=>{let h=G.hands[i],v=total(h),natural=v===21&&h.length===2;let res=v>21?'버스트':natural&&!dn?'블랙잭 승리':dn&&!natural?'패배':d>21||v>d?'승리':v===d?'무승부':'패배';return s.name+' '+v+'점 · '+res}).join(' / ')}

const blackJoker = 52, colorJoker = 53;
function attackValue(c) {

  if (c === blackJoker) return 7;

function legal(c,top,state) {

function beginOneCard() {

function oneControls(g) {

function act(id,a){if(!host||!G||G.end||seats[G.turn]?.id!==id)return;let i=G.turn,h=G.hands[i],n=seats.length;if(mode===0){if(!playPoker(i,a))return}

function home(){let old=$('name')?.value||'';$('view').innerHTML='<div class="hero"><div><h1>Clubroom</h1><p>친구들과 모이는 카드 테이블</p></div><span class="mark">♣</span></div><div class="panel"><h2>게임 선택</h2>'+gamePicker()+'<p>'+rules[mode]+'</p><div class="row"><input id="name" maxlength="12" placeholder="닉네임" aria-label="닉네임"><button class="primary" onclick="create(false)">멀티 방 만들기</button><button onclick="create(true)">혼자 연습</button></div></div><div class="panel"><h3>친구 방 참가</h3><div class="row"><input id="code" maxlength="6" inputmode="numeric" placeholder="방 코드 6자리"><button onclick="join()">참가하기</button></div></div>';$('name').value=old}
const nick=()=>$('name').value.trim().slice(0,12)||'플레이어';
function waiting(){ $('view').innerHTML='<h2>테이블 연결 중…</h2><button onclick="leave()">돌아가기</button>';say('')}
function netFail(t){leave(false);say(t)}
const peerRoomId = code => (Number(code)>=400000 && Number(code)<700000?'kr-onecard-v5-':'kr-clubroom-table-v4-') + code;
function create(local){let name=nick();if(!local&&!window.Peer)return say('멀티 연결 모듈을 불러오지 못했어요. 새로고침해 주세요.');host=true;solo=local;seats=[{id:me,name}];if(local){seats.push({id:'bot',name:'클로버 봇',bot:true});start();return}let e=epoch;room=String(Math.floor(100000+mode*300000+Math.random()*300000));waiting();peer=new Peer(peerRoomId(room));peer.on('open',()=>{if(e===epoch)sync()});peer.on('error',err=>{if(e===epoch&&err.type!=='peer-unavailable')netFail('방 연결 실패 · 다시 시도해 주세요.')});peer.on('connection',c=>{c.on('data',m=>{if(e!==epoch||!m)return;if(!connections.has(c.peer)){if(m.join!==true)return;if(G||seats.length>=4){c.send({error:'게임 중이거나 자리가 가득 찼어요.'});return}connections.set(c.peer,c);seats.push({id:c.peer,name:String(m.name||'친구').slice(0,12)});sync()}else if(connections.get(c.peer)===c)act(c.peer,m.action)});c.on('close',()=>{if(e!==epoch||connections.get(c.peer)!==c)return;connections.delete(c.peer);seats=seats.filter(s=>s.id!==c.peer);G=match=null;sync();say('친구가 나가 대기실로 돌아왔어요.')})})}
function join(){let code=$('code').value.trim(),name=nick();if(!/^\d{6}$/.test(code))return say('방 코드 숫자 6자리를 입력해 주세요.');if(!window.Peer)return say('멀티 연결 모듈을 불러오지 못했어요.');let e=epoch;waiting();peer=new Peer();timer=setTimeout(()=>{if(e===epoch&&!V)netFail('연결 시간이 초과됐어요. 방 코드와 네트워크를 확인해 주세요.')},18000);peer.on('error',()=>{if(e===epoch)netFail('방에 연결할 수 없어요. 방 코드를 확인해 주세요.')});peer.on('open',()=>{if(e!==epoch)return;link=peer.connect(peerRoomId(code),{reliable:true});link.on('open',()=>link.send({join:true,name}));link.on('close',()=>{if(e===epoch)netFail('방 연결이 종료됐어요.')});link.on('data',v=>{if(e!==epoch)return;if(v.error)return netFail(v.error);clearTimeout(timer);V=v;me=v.id;render()})})}
function card(c,action,disabled){let tag=action===undefined?'span':'button';return '<'+tag+' class="card '+(c===colorJoker||[1,2].includes(suit(c))?'red':'')+'" '+(tag==='button'?'onclick="cmd('+action+')" '+(disabled?'disabled':''):'')+'>'+(c>=blackJoker?'<small style="font:700 14px system-ui;color:inherit">'+(c===blackJoker?'흑조':'컬조')+'</small>':face(c))+'<i>'+(c>=blackJoker?'★':suits[suit(c)])+'</i></'+tag+'>'}
const cards=h=>'<div class="cards">'+h.map(c=>card(c)).join('')+'</div>';
function pokerButton(action, label, disabled = false) {
  return '<button ' + (disabled ? 'disabled ' : '') +
    "onclick='cmd(" + JSON.stringify(action) + ")'>" + label + '</button>';
}
function pokerControls(table, player) {
  let prompt, buttons;
  if (table.phase === 'exchange') {
    prompt = '바꿀 카드 한 장을 누르거나 지금 패를 유지하세요.';
    buttons = pokerButton('keep', '유지하기');
  } else if (table.pressure) {
    prompt = '따라가서 승부를 이어가거나, 폴드로 이번 판에서 빠지세요.';
    buttons = pokerButton('call', '따라가기') + pokerButton('fold', '폴드');
  } else {
    prompt = '체크로 넘기거나 압박을 선언하세요. 압박은 한 판에 한 번입니다.';
    buttons = pokerButton('check', '체크') + pokerButton('press', '압박', table.pressed[player]);
  }
  return '<p>' + prompt + '</p><div class="row">' + buttons + '</div>';
}
function pokerStandings(view) {
  const {match, seats, game} = view;
  const finished = match.round === matchLength && game.end;
  const compare = (a,b) => match.wins[b] - match.wins[a];
  const order = seats.map((_,i) => i).sort(compare);
  let rank = 1;
  return '<div class="panel"><h3>'+(finished?'5판 최종 순위':'현재 순위')+'</h3><div class="row">' +
    order.map((i, position) => {
      if (position && compare(order[position-1], i)) rank = position + 1;
      return '<span class="seat">'+rank+'위 '+esc(seats[i].name)+' · '+match.wins[i]+'승</span>';
    }).join('') + '</div></div>';
}
function render(){let {seats:ss,game:g,mode:m}=V,my=ss.findIndex(s=>s.id===me),turn=g&&!g.end&&g.turn===my;let html='<div class="hero"><h2>'+titles[m]+'</h2><button onclick="leave()">나가기</button></div><p>'+ (V.solo?'연습 테이블':'방 코드 <b>'+esc(V.room)+'</b>')+'</p><div class="row">'+ss.map((s,i)=>'<span class="seat '+(g&&!g.end&&g.turn===i?'active':'')+'">'+esc(s.name)+(i===my?' (나)':'')+(g?' · '+g.counts[i]+'장':'')+(m===0&&g?.poker.folded[i]?' · 폴드':'')+'</span>').join('')+'</div>';if(!g)html+='<div class="panel"><h2>친구를 기다리는 중</h2><p>같은 게임 링크에서 방 코드를 입력하면 참가할 수 있어요. 2~4명이 모이면 시작하세요.</p>'+(host?'<button class="primary" onclick="start()" '+(ss.length<2?'disabled':'')+'>게임 시작</button>':'방장이 시작하면 카드가 배분돼요.')+'</div>';else{if(m===0)html+='<p><b>'+V.match.round+' / '+matchLength+'판</b></p>';html+='<div class="table"><small>'+['공용 카드','더미 맨 위','딜러'][m]+'</small>'+cards(m===0?g.board:m===1?[g.top]:g.dealer)+(m===1?'<p>'+ (g.one.suit==null?'자유 무늬':suits[g.one.suit]+' 무늬')+' · '+(g.one.direction===1?'정방향 →':'역방향 ←')+(g.one.penalty?' · 누적 공격 '+g.one.penalty+'장':'')+'</p>':'')+(m===2&&!g.end?'뒷면 카드 1장':'')+'</div><h2 aria-live="polite">'+(g.end?esc(g.end):turn?'내 차례':esc(ss[g.turn]?.name)+'의 차례')+'</h2><p>'+esc(g.log)+'</p><h3>내 패'+(m===2?' · '+total(g.hand)+'점':'')+'</h3>';html+='<div class="cards">'+g.hand.map((c,i)=>(m===1||m===0&&g.poker.phase==='exchange')&&turn?card(c,i,m===1&&(g.one.choosing||!legal(c,g.top,g.one))):card(c)).join('')+'</div>';if(turn)html+=m===0?pokerControls(g.poker,my):m===1?oneControls(g):'<div class="row"><button class="primary" onclick="cmd(\'hit\')">한 장 더</button><button onclick="cmd(\'stand\')">멈추기</button></div>';if(g.revealed)g.revealed.forEach((h,i)=>{if(h&&i!==my)html+='<h3>'+esc(ss[i].name)+'</h3>'+cards(h)});if(m===0)html+=pokerStandings(V);if(g.end&&host)html+='<button class="primary" onclick="start()">'+(m===0&&V.match.round===matchLength?'새 5판 시작':'한 판 더')+'</button>'}html+='<details><summary>게임 규칙</summary><p>'+rules[m]+'</p></details>';$('view').innerHTML=html}
home();
window.addEventListener('DOMContentLoaded', () => {
  const query = new URLSearchParams(location.search);
  const action = query.get('action');
  if (!initialMode || !['create','join','solo'].includes(action)) return;
  const code = query.get('code') || '';
  history.replaceState(null, '', '?game=' + requestedGame);
  $('name').value = sessionStorage.getItem('cardroom-nickname') || '';
  if (action === 'join') {
    $('code').value = code;
    join();
  } else create(action === 'solo');
});
</script></html>
