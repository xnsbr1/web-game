</style><main><header><b>♣ CLUBROOM</b><small>카드 테이블</small></header><div id="view"></div><p id="status" role="status"></p></main>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" defer></script><script>
'use strict';
const titles=['홀덤 포커','원카드','블랙잭'];
const rules=['개인 카드 2장과 공용 카드 5장 중 가장 강한 5장 족보가 승리합니다. 모두 10,000점으로 시작합니다. 공용 카드 3장이 열리면 각자 원하는 숫자(0부터 최대 12자리까지)를 한 번 입력하고, 개인 카드 한 장을 교환하거나 유지합니다. 체크로 넘어가거나 판당 한 번 압박할 수 있어요. 압박을 받으면 따라가기 또는 폴드를 고릅니다. 승자는 부른 숫자의 합만큼 점수를 얻고, 동점이면 나눠 가집니다. 5판 뒤 승수가 높은 사람이 1위이며 승수가 같으면 점수를 비교합니다.','7장으로 시작합니다. 맨 위와 숫자 또는 무늬가 같은 카드를 내세요. 2는 다음 사람에게 2장을 주고 차례를 넘깁니다. J는 다음 사람을 건너뜁니다. 한 장을 뽑으면 차례가 끝납니다.','21을 넘기지 않고 딜러보다 높은 합계를 만드세요. A는 1 또는 11, 그림 카드는 10입니다. 딜러는 17부터 멈추며 처음 두 장의 21이 일반 21보다 우선합니다.'];
const suits='♠♥♦♣', rank=c=>c%13+2,suit=c=>Math.floor(c/13),face=c=>String(rank(c)).replace('14','A').replace('13','K').replace('12','Q').replace('11','J');
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function score5(cards){let r=cards.map(rank).sort((a,b)=>b-a),counts=new Map();for(let x of r)counts.set(x,(counts.get(x)||0)+1);let g=[...counts].sort((a,b)=>b[1]-a[1]||b[0]-a[0]);let straight=g.length===5?(r[0]-r[4]===4?r[0]:r.join()==='14,5,4,3,2'?5:0):0,flush=cards.every(c=>suit(c)===suit(cards[0]));let cat=flush&&straight?8:g[0][1]===4?7:g[0][1]===3&&g[1][1]===2?6:flush?5:straight?4:g[0][1]===3?3:g[1][1]===2?2:g[0][1]===2?1:0;let vals=straight?[straight]:g.map(v=>v[0]);while(vals.length<5)vals.push(0);return vals.reduce((n,v)=>n*15+v,cat)}
function poker(cs){let best=0;for(let i=0;i<7;i++)for(let j=i+1;j<7;j++)best=Math.max(best,score5(cs.filter((_,k)=>k!==i&&k!==j)));return best}
function total(h){let s=h.reduce((n,c)=>n+(rank(c)===14?1:Math.min(10,rank(c))),0);return s<=11&&h.some(c=>rank(c)===14)?s+10:s}
const matchLength = 5;
const startingPoints = 10_000;
const maxRoundNumber = 999_999_999_999;
const formatPoints = new Intl.NumberFormat('ko-KR', {maximumFractionDigits: 2}).format;
let match = null, turnToken = 0;
let peer,link,connections=new Map(),seats=[],me='host',host=false,solo=false,room='',mode=0,G,V,timer,epoch=0;
const $=id=>document.getElementById(id),say=t=>$('status').textContent=t,esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function start(){if(!host||G&&!G.end||seats.length<2)return;G={deck:shuffle(Array.from({length:52},(_,i)=>i)),hands:seats.map(()=>[]),turn:0,board:[],dealer:[],pile:[],end:'',log:'',stalls:0};for(let h of G.hands)for(let i=0;i<(mode===1?7:2);i++)h.push(G.deck.pop());if(mode===0)initPoker();if(mode===1)G.pile=[G.deck.pop()];if(mode===2){G.dealer=G.deck.splice(-2);nextBJ()}sync()}
function initPoker() {
  if (!match || match.round === matchLength) {
    match = {round: 0, points: seats.map(() => startingPoints * 12), wins: seats.map(() => 0)};
  }
  match.round++;
  G.board = G.deck.splice(-3);
  G.poker = {
    phase: 'numbers', numbers: seats.map(() => null), bonus: 0,
    folded: seats.map(() => false), pressed: seats.map(() => false),
    pressure: false, reveal: false, pending: [], token: ++turnToken
  };
  pokerQueue(seats.map((_, i) => i), (match.round - 1) % seats.length);
}
function pokerQueue(players, first) {
  const order = seats.map((_, offset) => (first + offset) % seats.length);
  G.poker.pending = order.filter(i => players.includes(i));
  G.turn = G.poker.pending[0];
}
function livePokerPlayers() {
  return seats.map((_, i) => i).filter(i => !G.poker.folded[i]);
}
function finishPoker(players) {
  const table = G.poker;
  let winners = players, handLabel = '';
  if (players.length > 1) {
    table.reveal = true;
    const scores = players.map(i => poker([...G.hands[i], ...G.board]));
    const best = Math.max(...scores);
    winners = players.filter((_, i) => scores[i] === best);
    handLabel = ' · ' + ['하이 카드','원 페어','투 페어','트리플','스트레이트','플러시','풀 하우스','포 카드','스트레이트 플러시'][Math.floor(best/15**5)];
  }
  for (const i of winners) {
    match.wins[i]++;
    match.points[i] += 12 * table.bonus / winners.length;
  }
  G.end = winners.map(i => seats[i].name).join(' · ') +
    (winners.length > 1 ? ' 공동 승리' : ' 승리') + handLabel;
}
function playPoker(i, move) {
  const table = G.poker;
  if (!move || move.token !== table.token) return false;
  const action = move.action;
  if (table.phase === 'numbers') {
    if (!Number.isInteger(action) || action < 0 || action > maxRoundNumber) return false;
    table.numbers[i] = action;
    table.bonus += action;
  } else if (table.phase === 'exchange') {
    if (!['keep', 0, 1].includes(action)) return false;
    if (action !== 'keep') G.hands[i][action] = G.deck.pop();
  } else {
    const allowed = table.pressure ? ['call', 'fold'] : ['check', 'press'];
    if (!allowed.includes(action) || action === 'press' && table.pressed[i]) return false;
    if (action === 'fold') table.folded[i] = true;
    if (action === 'press') {
      table.pressure = true;
      table.pressed[i] = true;
      pokerQueue(livePokerPlayers().filter(index => index !== i), (i + 1) % seats.length);
      G.log = seats[i].name + ' · 압박';
      table.token = ++turnToken;
      return true;
    }
    G.log = seats[i].name + ' · ' + {fold:'폴드', call:'따라가기', check:'체크'}[action];
  }

  table.token = ++turnToken;
  table.pending.shift();
  const players = livePokerPlayers();
  if (players.length === 1) finishPoker(players);
  else if (table.pending.length) G.turn = table.pending[0];
  else if (table.phase === 'numbers') {
    table.phase = 'exchange';
    pokerQueue(players, (match.round - 1) % seats.length);
  } else if (table.phase === 'exchange') {
    table.phase = 'decisions';
    pokerQueue(players, (match.round - 1) % seats.length);
  } else if (G.board.length < 5) {
    G.board.push(G.deck.pop());
    table.pressure = false;
    pokerQueue(players, (match.round + G.board.length - 4) % seats.length);
  } else finishPoker(players);
  return true;
}
function pokerBotMove() {
  const table = G.poker, i = G.turn;
  if (table.phase === 'numbers') return 100 + Math.floor(Math.random() * 901);
  if (table.phase === 'exchange') return Math.random() < .5 ? 'keep' : 0;
  if (table.pressure) return Math.random() < .25 ? 'fold' : 'call';
  return !table.pressed[i] && Math.random() < .3 ? 'press' : 'check';
}
function nextBJ(){while(G.turn<seats.length&&total(G.hands[G.turn])>=21)G.turn++;if(G.turn<seats.length&&total(G.dealer)!==21)return;while(total(G.dealer)<17)G.dealer.push(G.deck.pop());let d=total(G.dealer),dn=d===21&&G.dealer.length===2;G.end=seats.map((s,i)=>{let h=G.hands[i],v=total(h),natural=v===21&&h.length===2;let res=v>21?'버스트':natural&&!dn?'블랙잭 승리':dn&&!natural?'패배':d>21||v>d?'승리':v===d?'무승부':'패배';return s.name+' '+v+'점 · '+res}).join(' / ')}
function drawOne(h){if(!G.deck.length&&G.pile.length>1){let top=G.pile.pop();G.deck=shuffle(G.pile);G.pile=[top]}if(!G.deck.length)return false;h.push(G.deck.pop());return true}
function legal(c,top){return rank(c)===rank(top)||suit(c)===suit(top)}
function act(id,a){if(!host||!G||G.end||seats[G.turn]?.id!==id)return;let i=G.turn,h=G.hands[i],n=seats.length;if(mode===0){if(!playPoker(i,a))return}
else if(mode===1){let step=1;if(a==='draw'){let got=drawOne(h);G.stalls=got?0:G.stalls+1;G.log=seats[i].name+(got?' · 한 장 뽑기':' · 덱이 비어 패스');if(G.stalls>=n)G.end='덱 소진 · 무승부'}else{if(!Number.isInteger(a)||h[a]===undefined||!legal(h[a],G.pile.at(-1)))return;G.stalls=0;let c=h.splice(a,1)[0];G.pile.push(c);G.log=seats[i].name+' · '+face(c)+suits[suit(c)];if(!h.length)G.end=seats[i].name+' 승리!';else if(rank(c)===2||rank(c)===11){step=2;if(rank(c)===2){drawOne(G.hands[(i+1)%n]);drawOne(G.hands[(i+1)%n])}G.log+=' · 다음 차례 건너뛰기'}}G.turn=(i+step)%n}
else{if(a==='hit')h.push(G.deck.pop());else if(a==='stand')G.turn++;else return;nextBJ()}sync()}
function project(id){let i=seats.findIndex(s=>s.id===id);return {id,room,mode,seats,solo,match,game:G&&{poker:G.poker,hand:G.hands[i],counts:G.hands.map(h=>h.length),revealed:G.end&&mode!==1?G.hands.map((h,k)=>mode===2||G.poker.reveal&&!G.poker.folded[k]?h:null):null,turn:G.turn,board:G.board,top:G.pile.at(-1),dealer:G.end?G.dealer:G.dealer.slice(0,1),end:G.end,log:G.log}}}
function sync(){clearTimeout(timer);V=project(me);render();for(let [id,c] of connections)if(c.open)c.send(project(id));if(G&&!G.end&&seats[G.turn]?.bot)timer=setTimeout(()=>{let h=G.hands[G.turn],a=mode===0?{action:pokerBotMove(),token:G.poker.token}:mode===2?(total(h)<17?'hit':'stand'):h.findIndex(c=>legal(c,G.pile.at(-1)));act(seats[G.turn].id,a===-1?'draw':a)},650)}
function cmd(a){if(V.mode===0)a={action:a,token:V.game.poker.token};if(host)act(me,a);else if(link?.open)link.send({action:a})}
function leave(){epoch++;clearTimeout(timer);let p=peer;peer=link=null;connections=new Map();seats=[];host=solo=false;room='';me='host';G=V=match=null;p?.destroy();home();say('')}
function home(){let old=$('name')?.value||'';$('view').innerHTML='<div class="hero"><div><h1>Clubroom</h1><p>친구들과 모이는 카드 테이블</p></div><span class="mark">♣</span></div><div class="panel"><h2>게임 선택</h2><div class="row">'+titles.map((t,i)=>'<button class="'+(mode===i?'chosen':'')+'" onclick="mode='+i+';home()">'+t+'</button>').join('')+'</div><p>'+rules[mode]+'</p><div class="row"><input id="name" maxlength="12" placeholder="닉네임" aria-label="닉네임"><button class="primary" onclick="create(false)">멀티 방 만들기</button><button onclick="create(true)">혼자 연습</button></div></div><div class="panel"><h3>친구 방 참가</h3><div class="row"><input id="code" maxlength="6" inputmode="numeric" placeholder="방 코드 6자리"><button onclick="join()">참가하기</button></div></div>';$('name').value=old}
const nick=()=>$('name').value.trim().slice(0,12)||'플레이어';
function waiting(){ $('view').innerHTML='<h2>테이블 연결 중…</h2><button onclick="leave()">돌아가기</button>';say('')}
function netFail(t){leave();say(t)}
const prefix='kr-clubroom-table-v3-';
function create(local){let name=nick();if(!local&&!window.Peer)return say('멀티 연결 모듈을 불러오지 못했어요. 새로고침해 주세요.');host=true;solo=local;seats=[{id:me,name}];if(local){seats.push({id:'bot',name:'클로버 봇',bot:true});start();return}let e=epoch;room=String(Math.floor(100000+Math.random()*900000));waiting();peer=new Peer(prefix+room);peer.on('open',()=>{if(e===epoch)sync()});peer.on('error',err=>{if(e===epoch&&err.type!=='peer-unavailable')netFail('방 연결 실패 · 다시 시도해 주세요.')});peer.on('connection',c=>{c.on('data',m=>{if(e!==epoch||!m)return;if(!connections.has(c.peer)){if(m.join!==true)return;if(G||seats.length>=4){c.send({error:'게임 중이거나 자리가 가득 찼어요.'});return}connections.set(c.peer,c);seats.push({id:c.peer,name:String(m.name||'친구').slice(0,12)});sync()}else if(connections.get(c.peer)===c)act(c.peer,m.action)});c.on('close',()=>{if(e!==epoch||connections.get(c.peer)!==c)return;connections.delete(c.peer);seats=seats.filter(s=>s.id!==c.peer);G=match=null;sync();say('친구가 나가 대기실로 돌아왔어요.')})})}
function join(){let code=$('code').value.trim(),name=nick();if(!/^\d{6}$/.test(code))return say('방 코드 숫자 6자리를 입력해 주세요.');if(!window.Peer)return say('멀티 연결 모듈을 불러오지 못했어요.');let e=epoch;waiting();peer=new Peer();timer=setTimeout(()=>{if(e===epoch&&!V)netFail('연결 시간이 초과됐어요. 방 코드와 네트워크를 확인해 주세요.')},18000);peer.on('error',()=>{if(e===epoch)netFail('방에 연결할 수 없어요. 방 코드를 확인해 주세요.')});peer.on('open',()=>{if(e!==epoch)return;link=peer.connect(prefix+code,{reliable:true});link.on('open',()=>link.send({join:true,name}));link.on('close',()=>{if(e===epoch)netFail('방 연결이 종료됐어요.')});link.on('data',v=>{if(e!==epoch)return;if(v.error)return netFail(v.error);clearTimeout(timer);V=v;me=v.id;render()})})}
function card(c,action,disabled){let tag=action===undefined?'span':'button';return '<'+tag+' class="card '+([1,2].includes(suit(c))?'red':'')+'" '+(tag==='button'?'onclick="cmd('+action+')" '+(disabled?'disabled':''):'')+'>'+face(c)+'<i>'+suits[suit(c)]+'</i></'+tag+'>'}
const cards=h=>'<div class="cards">'+h.map(c=>card(c)).join('')+'</div>';
function pokerButton(action, label, disabled = false) {
  return '<button ' + (disabled ? 'disabled ' : '') +
    "onclick='cmd(" + JSON.stringify(action) + ")'>" + label + '</button>';
}
function pokerControls(table, player) {
  let prompt, buttons;
  if (table.phase === 'numbers') {
    return '<p>입력한 숫자는 이번 판 승자에게 줄 보너스에 더해져요.</p>' +
      '<form class="row" onsubmit="event.preventDefault(); cmd(Number(this.elements.roundNumber.value))">' +
      '<input name="roundNumber" inputmode="numeric" pattern="[0-9]{1,12}" maxlength="12" required ' +
      'aria-label="이번 판 숫자" placeholder="숫자 입력" title="0부터 12자리까지의 정수">' +
      '<button class="primary" type="submit">확정</button></form>';
  } else if (table.phase === 'exchange') {
    prompt = '바꿀 카드 한 장을 누르거나 지금 패를 유지하세요.';
    buttons = pokerButton('keep', '유지하기');
  } else if (table.pressure) {
    prompt = '따라가서 승부를 이어가거나, 폴드로 이번 판에서 빠지세요.';
    buttons = pokerButton('call', '따라가기') + pokerButton('fold', '폴드');
  } else {
    prompt = '체크로 넘기거나 압박을 선언하세요. 압박은 한 판에 한 번입니다.';
    buttons = pokerButton('check', '체크') + pokerButton('press', '압박', table.pressed[player]);
  }
  return '<p>' + prompt + '</p><div class="row">' + buttons + '</div>';
}
function pokerStandings(view) {
  const {match, seats, game} = view;
  const finished = match.round === matchLength && game.end;
  const compare = (a,b) => match.wins[b] - match.wins[a] || match.points[b] - match.points[a];
  const order = seats.map((_,i) => i).sort(compare);
  let rank = 1;
  return '<div class="panel"><h3>'+(finished?'5판 최종 순위':'현재 순위')+'</h3><div class="row">' +
    order.map((i, position) => {
      if (position && compare(order[position-1], i)) rank = position + 1;
      return '<span class="seat">'+rank+'위 '+esc(seats[i].name)+' · '+match.wins[i]+'승 · '+
        formatPoints(match.points[i] / 12)+'점</span>';
    }).join('') + '</div></div>';
}
function render(){let {seats:ss,game:g,mode:m}=V,my=ss.findIndex(s=>s.id===me),turn=g&&!g.end&&g.turn===my;let html='<div class="hero"><h2>'+titles[m]+'</h2><button onclick="leave()">나가기</button></div><p>'+ (V.solo?'연습 테이블':'방 코드 <b>'+esc(V.room)+'</b>')+'</p><div class="row">'+ss.map((s,i)=>'<span class="seat '+(g&&!g.end&&g.turn===i?'active':'')+'">'+esc(s.name)+(i===my?' (나)':'')+(g?' · '+g.counts[i]+'장':'')+'</span>').join('')+'</div>';if(!g)html+='<div class="panel"><h2>친구를 기다리는 중</h2><p>같은 게임 링크에서 방 코드를 입력하면 참가할 수 있어요. 2~4명이 모이면 시작하세요.</p>'+(host?'<button class="primary" onclick="start()" '+(ss.length<2?'disabled':'')+'>게임 시작</button>':'방장이 시작하면 카드가 배분돼요.')+'</div>';else{if(m===0)html+='<p><b>'+V.match.round+' / '+matchLength+'판</b> · 이번 판 보너스 <b>'+formatPoints(g.poker.bonus)+'점</b></p><div class="row">'+ss.map((seat,i)=>'<span class="seat">'+esc(seat.name)+' · '+(g.poker.numbers[i]===null?'입력 전':formatPoints(g.poker.numbers[i]))+(g.poker.folded[i]?' · 폴드':'')+'</span>').join('')+'</div>';html+='<div class="table"><small>'+['공용 카드','더미 맨 위','딜러'][m]+'</small>'+cards(m===0?g.board:m===1?[g.top]:g.dealer)+(m===2&&!g.end?'뒷면 카드 1장':'')+'</div><h2 aria-live="polite">'+(g.end?esc(g.end):turn?'내 차례':esc(ss[g.turn]?.name)+'의 차례')+'</h2><p>'+esc(g.log)+'</p><h3>내 패'+(m===2?' · '+total(g.hand)+'점':'')+'</h3>';html+='<div class="cards">'+g.hand.map((c,i)=>(m===1||m===0&&g.poker.phase==='exchange')&&turn?card(c,i,m===1&&!legal(c,g.top)):card(c)).join('')+'</div>';if(turn)html+=m===0?pokerControls(g.poker,my):m===1?'<button onclick="cmd(\'draw\')">한 장 뽑기</button>':'<div class="row"><button class="primary" onclick="cmd(\'hit\')">한 장 더</button><button onclick="cmd(\'stand\')">멈추기</button></div>';if(g.revealed)g.revealed.forEach((h,i)=>{if(h&&i!==my)html+='<h3>'+esc(ss[i].name)+'</h3>'+cards(h)});if(m===0)html+=pokerStandings(V);if(g.end&&host)html+='<button class="primary" onclick="start()">'+(m===0&&V.match.round===matchLength?'새 5판 시작':'한 판 더')+'</button>'}html+='<details><summary>게임 규칙</summary><p>'+rules[m]+'</p></details>';$('view').innerHTML=html}
home();
</script></html>
