    const max = Math.min(blackjackMaxBet, Math.floor(balance / betStep) * betStep);
    selectedBet = Math.min(Math.max(max, betStep), selectedBet);
    if (max) html += '<div class="row"><button onclick="updateBlackjackBet(selectedBet-50)">−50</button>' +
      '<input id="blackjack-bet" type="range" aria-label="베팅 금액" min="50" max="' + max +
      '" step="50" value="' + selectedBet + '" oninput="updateBlackjackBet(Number(this.value))">' +
      '<button onclick="updateBlackjackBet(selectedBet+50)">+50</button>' +
      '<button class="primary" id="blackjack-submit" onclick="cmd(selectedBet)">베팅 (' +
      selectedBet + '칩)</button></div>';

  } else {
    html += '<p>' + (game.bets[player] ? '내 베팅 ' + game.bets[player] + '칩 확정' : '칩 소진 · 이번 판 관전') +
      ' · 다른 참가자를 기다리는 중</p>';
  }
  return html + '</div>';
}
let audio = null, alerted = false;
let sound = localStorage.getItem('clubroom-sound') !== 'off';
function prepareAudio() {
  const Context = window.AudioContext || window.webkitAudioContext;
  if (!sound || !Context) return;
  audio ??= new Context();
  audio.resume().catch(() => {});
}
function toggleSound() {
  sound = !sound;
  localStorage.setItem('clubroom-sound', sound ? 'on' : 'off');
  prepareAudio();
  render();
}
function signalTurn(turn) {
  if (turn && !alerted && sound && audio?.state === 'running') {
    const oscillator = audio.createOscillator(), gain = audio.createGain();
    oscillator.frequency.value = 660;
    gain.gain.value = .08;
    oscillator.connect(gain).connect(audio.destination);
    oscillator.start();
    oscillator.stop(audio.currentTime + .16);
  }
  alerted = turn;
}
function roomTools() {
  return '<div class="row room-tools">' +
    (V.solo ? '' : '<button onclick="shareRoom()">참가 링크 공유</button>') +
    '<button onclick="toggleSound()" aria-pressed="' + sound + '">차례 소리 ' +
    (sound ? '켜짐' : '꺼짐') + '</button></div>';
}
function switchControls() {
  if (!host) return '<p>방장이 다음 게임을 정할 수 있어요.</p>';
  return '<div class="row"><b>같은 방에서 게임 바꾸기</b>' + titles.map((title, i) =>
    '<button onclick="changeGame(' + i + ')" ' + (V.mode === i ? 'disabled' : '') + '>' + title + '</button>').join('') + '</div>';
}
function attackHistory(g) {
  const canBlock = g.one.penalty && attackValue(g.top) === 2;
  if (!g.one.history.length) return '';
  return '<div class="panel"><h3>공격 기록</h3><ol>' +
    g.one.history.map(entry => '<li>' + esc(entry) + '</li>').join('') + '</ol>' +
    (canBlock ? '<p>3을 내면 누적 공격을 막을 수 있어요.</p>' : '') + '</div>';
}
function renderBlackjackHands(hands, activeIndex = -1) {
  return hands.map((hand, index) =>
    '<div class="panel"><b>' + (hands.length > 1 ? '패 ' + (index + 1) + ' · ' : '') +
    scoreText(hand.cards) + ' · ' + hand.bet + '칩' +
    (activeIndex === index ? ' · 진행 중' : '') +
    '</b>' + cards(hand.cards) + '</div>').join('');
}
function blackjackControls(g, balance) {
  const hand = g.blackjack.hands[g.handIndex];
  const options = blackjackOptions(g.blackjack, hand, balance);
  return '<div class="row"><button class="primary" onclick="cmd(\'hit\')">한 장 더</button>' +
    '<button onclick="cmd(\'stand\')">멈추기</button>' +
    (options.double ? '<button onclick="cmd(\'double\')">더블다운 (+' + hand.bet + '칩)</button>' : '') +
    (options.split ? '<button onclick="cmd(\'split\')">스플릿 (+' + hand.bet + '칩)</button>' : '') + '</div>';
}
const pokerRanks = ['하이 카드','원 페어','투 페어','트리플','스트레이트','플러시','풀 하우스','포 카드','스트레이트 플러시'];
function pokerRankText(hand, board) {
  return pokerRanks[Math.floor(poker([...hand, ...board]) / 15**5)];
}
function cardBacks(count) {
  return Array.from({length:count}, () => '<span class="card sleeve" aria-label="뒷면 카드">♠</span>').join('');
}
function renderTable(view, my) {
  const {mode, seats, game} = view;
  const holdem = mode === 0;
  const order = seats.map((_,i) => i).filter(i => i !== my);
  function seatMarkup(i, own = false) {
    const active = !game.end && game.turn === i;
    const balance = holdem ? view.match.chips[i] : view.bank[i];
    const folded = holdem && game.poker.folded[i];
    const hand = own ? game.hand : game.revealed?.[i];
    let content;
    if (holdem && hand?.length) {
      content = cards(hand) + '<strong class="hand-rank">족보 · ' + pokerRankText(hand, game.board) + '</strong>';
    } else if (!holdem && (own || game.end)) {
      const hands = own ? game.blackjack.hands : game.blackjackResults[i];
      content = hands.length ? renderBlackjackHands(hands, active ? game.handIndex : -1) : '<small>관전</small>';
    } else if (game.counts[i]) {
      content = '<div class="cards">' + cardBacks(game.counts[i]) + '</div>';
    } else content = '<small>관전</small>';
    return '<div class="table-seat' + (active ? ' table-seat-active' : '') + '">' +
      '<div class="seat-name">' + esc(seats[i].name) + (own ? ' (나)' : '') + '</div>' +
      '<small>' + balance + '칩' + (folded ? ' · 폴드' : '') +
      (seats[i].offline ? ' · 재접속 대기' : '') + '</small>' + content + '</div>';
  }
  const centerCards = holdem ? game.board : game.dealer;
  const center = '<div class="table-center"><strong>' + (holdem ? '공용 카드' : '딜러') + '</strong>' +
    '<div class="cards">' + centerCards.map(cardId => card(cardId)).join('') +
    (!holdem && !game.end ? cardBacks(1) : '') + '</div>' +
    (!holdem ? '<small>' + (game.end ? '' : '공개 카드 ') + scoreText(centerCards) + '</small>' : '') +
    '</div>';
  return '<div class="table card-table"><div class="table-opponents">' +
    order.map(i => seatMarkup(i)).join('') + '</div>' + center + seatMarkup(my,true) + '</div>';
}
function renderTurnBanner(game, players, my, offline, turn) {
  const banner = $('turn-bar');
  let text = '';
  if (offline) text = '일시 정지 · 재접속 대기 중';
  else if (!game) text = '대기실 · 게임 시작 대기';
  else if (game.end) text = '이번 판 종료';
  else if (game.phase === 'betting') text = game.bets[my] === null ? '베팅 금액을 선택하세요' : '베팅 확정 · 다른 참가자 대기';
  else if (game.phase === 'insurance') text = game.blackjack.insurance === null ? '보험을 선택하세요' : '다른 참가자의 보험 선택 대기';
  else if (turn) text = '내 차례 · ' + players[my].name;
  else if (players[game.turn]) text = players[game.turn].name + ' 님의 차례';

  banner.hidden = !text;
  banner.dataset.active = String(turn);
  if (banner.textContent !== text) banner.textContent = text;
}
function render() {
  const {seats:ss, game:g, mode:m} = V;
  const my = ss.findIndex(seat => seat.id === me);
  const offline = ss.some(seat => seat.offline);
  const turn = Boolean(g && !g.end && g.turn === my && !offline);
  signalTurn(turn);
  renderTurnBanner(g, ss, my, offline, turn);
  let html = '<div class="hero"><h2>' + titles[m] + '</h2><button onclick="leave()">' +
    (host && !V.solo ? '방 저장하고 나가기' : '나가기') + '</button></div>' +
    '<p>' + (V.solo ? '연습 테이블' : '방 코드 <b>' + esc(V.room) + '</b>') + '</p>' + roomTools();
  if (!g || m === 1 || g.phase === 'betting') html += '<div class="row">' + ss.map((seat, i) => {
    const balance = m === 2 ? V.bank?.[i] : m === 0 ? V.match?.chips[i] : undefined;
    return '<span class="seat ' + (g && !g.end && g.turn === i ? 'active' : '') + '">' +
      esc(seat.name) + (i === my ? ' (나)' : '') + (seat.offline ? ' · 재접속 대기' : '') +
      (balance === undefined ? '' : ' · ' + balance + '칩') +
      (g && g.phase !== 'betting' ? ' · ' + g.counts[i] + '장' : '') +
      (m === 0 && g?.poker.folded[i] ? ' · 폴드' : '') + '</span>';
  }).join('') + '</div>';
  if (offline) html += '<p role="status">친구의 재접속을 기다리는 중이에요. 자리는 60초간 유지돼요.</p>';

  if (!g) {
    html += '<div class="panel"><h3>대기실</h3><p>친구는 방 코드나 참가 링크로 들어올 수 있어요. 2~4명이 모이면 시작하세요.</p>' +
      (host ? '<button class="primary" onclick="start()" ' + (ss.length < 2 || offline ? 'disabled' : '') +
      '>게임 시작</button>' : '방장이 시작하면 카드가 배분돼요.') + '</div>' + switchControls();
  } else if (m === 2 && g.phase === 'betting') {
    if (!offline) html += renderBlackjackBets(V, my);
  } else {
    if (m === 0) html += '<p><b>' + V.match.round + ' / ' + matchLength + '판</b> · 팟 ' +
      (g.end ? 0 : g.poker.paid.reduce((sum, value) => sum + value, 0)) + '칩</p>';
    if (m === 1) {
      html += '<div class="table"><small>더미 맨 위</small>' + cards([g.top]) +
        '<p>' + (g.one.suit == null ? '자유 무늬' : suits[g.one.suit] + ' 무늬') +
        ' · ' + (g.one.direction === 1 ? '정방향 →' : '역방향 ←') +
        (g.one.penalty ? ' · 누적 공격 ' + g.one.penalty + '장' : '') + '</p></div>';
    } else html += renderTable(V, my);
    if (g.end) html += '<h2 aria-live="polite">' + esc(g.end) + '</h2>';
    if (g.log) html += '<p>' + esc(g.log) + '</p>';
    if (m === 2) {
      if (!offline && g.phase === 'insurance') {
        html += g.blackjack.insurance === null ?
          '<div class="row"><button onclick="cmd(\'insure\')">보험 (' + g.bets[my] / 2 + '칩)</button>' +
          '<button onclick="cmd(\'decline\')">보험 건너뛰기</button></div>' : '<p>다른 참가자의 보험 선택을 기다리는 중</p>';
      }
    } else if (m === 1) {
      html += '<h3>내 패</h3><div class="cards">' + g.hand.map((c,i) =>
        turn ? card(c,i,g.one.choosing || !legal(c,g.top,g.one)) : card(c)).join('') + '</div>';
    }
    if (m === 0 && !g.end && (turn || !V.solo)) {
      html += '<fieldset ' + (turn ? '' : 'disabled') + '><legend>홀덤 베팅</legend>' +
        pokerControls(g.poker,my) + '</fieldset>';
    }
    if (turn && m !== 0) html += m === 1 ? oneControls(g) : blackjackControls(g, V.bank[my]);
    if (m === 1) html += attackHistory(g);
    if (m === 0) html += pokerStandings(V);
    if (g.end) {
      if (host && !offline) {
        if (m === 2 && V.bank.some(balance => balance < betStep)) {
          html += '<button onclick="resetBlackjackBank()">연습 칩 초기화 후 시작</button> ';
        }
        if (m !== 2 || V.bank.some(balance => balance >= betStep)) {
          html += '<button class="primary" onclick="start()">' +
            (m === 0 && (V.match.round === matchLength || V.match.chips.filter(chips=>chips>0).length < 2) ?
              '새 5판 시작' : '한 판 더') + '</button>';
        }
      }
      html += switchControls();
    }
  }
  $('view').innerHTML = html + '<details><summary>게임 규칙</summary><p>' + rules[m] + '</p></details>';
}
function pageSignature(page) {
  return [...page.querySelectorAll('title, meta, link, style, script, main header')]
    .map(element => element.outerHTML).join('\n');
}
const runningPage = pageSignature(document);
let checkingUpdate = false;
let updateReady = false;

function applyAppUpdate() {
  if (!updateReady || host || room || peer || document.visibilityState === 'hidden') return;
  const url = new URL(location.href);
  const nick = $('name')?.value || '';
  sessionStorage.setItem('clubroom-update-draft', JSON.stringify({nick, mode, code:$('code')?.value || ''}));
  url.searchParams.set('_app_update', Date.now().toString());
  location.replace(url.href);
}
async function checkAppUpdate() {
  if (document.visibilityState === 'hidden' || checkingUpdate) return;
  if (updateReady) return applyAppUpdate();
  checkingUpdate = true;
  try {
    const response = await fetch(location.pathname, {cache:'no-store'});
    if (!response.ok) return;
    const nextPage = new DOMParser().parseFromString(await response.text(), 'text/html');
    if (!nextPage.querySelector('#view') || !nextPage.querySelector('script:not([src])')) return;
    if (pageSignature(nextPage) === runningPage) return;
    updateReady = true;
    if (!host && !room && !peer) applyAppUpdate();
    else $('update-note').textContent = '새 버전이 준비됐어요. 방을 나가면 자동으로 적용돼요.';
  } catch {
    // A later check can retry when the network returns.
  } finally {
    checkingUpdate = false;
  }
}
function restoreUpdateDraft() {
  const url = new URL(location.href);
  if (!url.searchParams.has('_app_update')) return;
  url.searchParams.delete('_app_update');
  history.replaceState(null, '', url.href);
  const saved = sessionStorage.getItem('clubroom-update-draft');
  sessionStorage.removeItem('clubroom-update-draft');
  if (!saved) return;
  const draft = JSON.parse(saved);
  mode = draft.mode;
  home();
  $('name').value = draft.nick;
  $('code').value = draft.code;
}
function queryRoom() {
  const query = new URLSearchParams(location.search);
  return query.get('room') || query.get('code') || '';
}
home();
window.addEventListener('DOMContentLoaded', () => {
  restoreUpdateDraft();
  checkAppUpdate();
  const hostCode = new URLSearchParams(location.search).get('hostRoom');
  if (hostCode && savedHostRoom()?.code === hostCode) {
    resumeHostRoom();
    return;
  }
  const code = queryRoom();
  if (code) {
    $('code').value = code;
    if (sessionStorage.getItem(ticketKey(code))) join();
    else $('name').focus();
    return;
  }
  const action = new URLSearchParams(location.search).get('action');
  if (action === 'create' || action === 'solo') {
    history.replaceState(null, '', '?game=' + (requestedGame || 'holdem'));
    $('name').value = sessionStorage.getItem('cardroom-nickname') || '';
    create(action === 'solo');
  }
});
window.addEventListener('pagehide', saveHostRoom);
window.addEventListener('focus', checkAppUpdate);
window.addEventListener('pageshow', checkAppUpdate);
window.addEventListener('online', checkAppUpdate);
document.addEventListener('visibilitychange', checkAppUpdate);
setInterval(checkAppUpdate, 60000);
window.addEventListener('pointerdown', prepareAudio, {passive:true});
</script></html>
