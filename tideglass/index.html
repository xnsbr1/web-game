<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102e39"><title>유리조 · 침수항 탐험</title><link rel="stylesheet" href="art.css"><link rel="stylesheet" href="style.css">
<main id="home"><article><small>조수 탐사 기록　/　01</small><h1>유리조</h1><h2>해질녘의 침수항</h2><p>항구 아래 잠든 불씨를 찾아 등대를 다시 밝히세요.</p><button id="solo">혼자 탐험하기　→</button><button id="host">친구와 새 항구 열기</button><form id="join"><input id="code" maxlength="6" placeholder="방 코드" aria-label="방 코드" required><button>참가</button></form><output id="status"></output></article></main>
<section id="game" hidden><canvas id="world" aria-label="침수항 탐험 지도"></canvas><header><button id="back" aria-label="기지로 돌아가기">‹</button><div><small id="loc"></small><b id="goal"></b></div></header><aside id="bag"></aside><div id="toast" role="status"></div><footer><div><button data-key="left">◀</button><button data-key="right">▶</button><button data-key="jump">↑</button></div><div><button id="mode">곡괭이</button><button id="craft">제작</button><button data-key="act">사용</button></div></footer></section>
<script src="game.js"></script></html>
