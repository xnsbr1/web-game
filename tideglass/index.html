<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102e39"><meta name="game-version" content="0.2.2"><title>유리조 · 침수항 탐험</title><link rel="stylesheet" href="art.css"><link rel="stylesheet" href="style.css?v=0.2.2">
<main id="home"><article><small>조수 탐사 기록　/　01</small><h1>유리조</h1><h2>해질녘의 침수항</h2><p>등대를 밝히고 산호 종유굴과 지하 용광로를 탐험하세요.</p><button id="solo">혼자 탐험하기　→</button><button id="host">친구와 새 항구 열기</button><form id="join"><input id="code" maxlength="6" placeholder="방 코드" aria-label="방 코드" required><button>참가</button></form><output id="status"></output><small>버전 0.2.2</small></article></main>
<section id="game" hidden><canvas id="world" aria-label="침수항 탐험 지도"></canvas><header><button id="back" aria-label="기지로 돌아가기">‹</button><div><small id="loc"></small><b id="goal"></b></div></header><aside id="bag"></aside><small id="update-notice" role="status" hidden style="position:absolute;right:8px;top:98px;background:#102935ed;padding:6px 9px;border-radius:6px">새 버전 · 방에서 나오면 적용</small><div id="toast" role="status"></div><footer class="touch-controls" aria-label="탐험 조작">
 <div class="move-controls">
  <button type="button" data-key="left" aria-label="왼쪽으로 이동">◀</button>
  <button type="button" data-key="right" aria-label="오른쪽으로 이동">▶</button>
 </div>
 <div class="action-controls">
  <button type="button" data-key="act">사용</button>
  <button type="button" data-key="jump" aria-label="점프"><span aria-hidden="true">↑</span><small>점프</small></button>
 </div>
 <div class="tool-controls">
  <button type="button" id="mode">곡괭이</button>
  <button type="button" id="craft">제작</button>
 </div>
</footer></section>
<script src="game.js?v=0.2.2"></script>
<script>
(() => {
 const version = document.querySelector('meta[name="game-version"]').content;
 let checking = false;
 let reloading = false;

 async function checkVersion() {
  if (checking || reloading || document.hidden) return;
  checking = true;
  try {
   const url = new URL('index.html', location.href);
   url.searchParams.set('check', Date.now());
   const response = await fetch(url, {cache: 'no-store'});
   if (!response.ok) return;
   const page = new DOMParser().parseFromString(await response.text(), 'text/html');
   const latest = page.querySelector('meta[name="game-version"]')?.content;
   if (!latest || latest === version) return;

   // A refresh would disconnect the room and discard its shared world.
   if ((typeof active !== 'undefined' && active && role !== 'solo') ||
       (typeof peer !== 'undefined' && peer && typeof active !== 'undefined' && !active)) {
    const notice = document.getElementById('update-notice');
    notice.hidden = false;
    return;
   }
   if (typeof save === 'function') {
    save();
    if (typeof dirty !== 'undefined' && dirty) return;
   }

   reloading = true;
   const next = new URL(location.href);
   next.searchParams.set('v', latest);
   next.searchParams.set('updated', Date.now());
   location.replace(next.href);
  } catch {
   // Keep playing while offline. The next check will retry.
  } finally {
   checking = false;
  }
 }

 setInterval(checkVersion, 15000);
 addEventListener('pageshow', checkVersion);
 addEventListener('online', checkVersion);
 document.addEventListener('visibilitychange', checkVersion);
 document.getElementById('back').addEventListener('click', checkVersion);
})();
</script></html>
