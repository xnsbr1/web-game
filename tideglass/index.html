<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102e39"><meta name="game-version" content="0.1.1"><title>유리조 · 침수항 탐험</title><link rel="stylesheet" href="art.css"><link rel="stylesheet" href="style.css?v=0.1.1">
<main id="home"><article><small>조수 탐사 기록　/　01</small><h1>유리조</h1><h2>해질녘의 침수항</h2><p>항구 아래 잠든 불씨를 찾아 등대를 다시 밝히세요.</p><button id="solo">혼자 탐험하기　→</button><button id="host">친구와 새 항구 열기</button><form id="join"><input id="code" maxlength="6" placeholder="방 코드" aria-label="방 코드" required><button>참가</button></form><output id="status"></output><small>버전 0.1.1</small></article></main>
<section id="game" hidden><canvas id="world" aria-label="침수항 탐험 지도"></canvas><header><button id="back" aria-label="기지로 돌아가기">‹</button><div><small id="loc"></small><b id="goal"></b></div></header><aside id="bag"></aside><small id="update-notice" role="status" hidden style="position:absolute;right:8px;top:98px;background:#102935ed;padding:6px 9px;border-radius:6px">새 버전 · 방에서 나오면 적용</small><div id="toast" role="status"></div><footer><div><button data-key="left">◀</button><button data-key="right">▶</button><button data-key="jump">↑</button></div><div><button id="mode">곡괭이</button><button id="craft">제작</button><button data-key="act">사용</button></div></footer></section>
<script src="game.js?v=0.1.1"></script>
<script>
(() => {
 const version = document.querySelector('meta[name="game-version"]').content;
 let checking = false;
 let reloading = false;

 async function checkVersion() {
  if (checking || reloading || document.hidden) return;
  checking = true;
  try {
   const url = new URL('index.html', location.href);
   url.searchParams.set('check', Date.now());
   const response = await fetch(url, {cache: 'no-store'});
   if (!response.ok) return;
   const page = new DOMParser().parseFromString(await response.text(), 'text/html');
   const latest = page.querySelector('meta[name="game-version"]')?.content;
   if (!latest || latest === version) return;

   // A refresh would disconnect the room and discard its shared world.
   if ((typeof active !== 'undefined' && active && role !== 'solo') ||
       (typeof peer !== 'undefined' && peer && typeof active !== 'undefined' && !active)) {
    const notice = document.getElementById('update-notice');
    notice.hidden = false;
    return;
   }
   if (typeof save === 'function') {
    save();
    if (typeof dirty !== 'undefined' && dirty) return;
   }

   reloading = true;
   const next = new URL(location.href);
   next.searchParams.set('v', latest);
   next.searchParams.set('updated', Date.now());
   location.replace(next.href);
  } catch {
   // Keep playing while offline. The next check will retry.
  } finally {
   checking = false;
  }
 }

 setInterval(checkVersion, 15000);
 addEventListener('pageshow', checkVersion);
 addEventListener('online', checkVersion);
 document.addEventListener('visibilitychange', checkVersion);
 document.getElementById('back').addEventListener('click', checkVersion);
})();
</script></html>
