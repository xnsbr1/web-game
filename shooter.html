<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="심층 탄환">
<meta name="theme-color" content="#12171a">
<meta name="game-build" content="4.0.0">
<title>심층 탄환</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--surface:#1e282c;--line:#33434a;--text:#f5f1e8;--muted:#b2c1c5;--amber:#ffd189;--teal:#8fe8d4}
body{margin:0;background:radial-gradient(ellipse at top,#25363e,#12171a 60%);color:var(--text);font:15px/1.5 system-ui,-apple-system,sans-serif}
button,select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible{outline:2px solid var(--teal)}
main{max-width:1000px;margin:auto;padding:16px clamp(10px,3vw,32px) 32px}h1,h2,p{margin:0}h1{font-size:clamp(31px,6vw,62px);line-height:1;letter-spacing:-.08em}h2{font-size:20px}
header{display:flex;align-items:end;justify-content:space-between;gap:8px;margin:12px 0 20px}
#money{color:var(--amber);font-size:12px;text-align:right}
nav,.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}nav{margin-bottom:12px}nav button[aria-pressed=true],.primary{background:var(--teal);color:#142625;font-weight:800;border-color:transparent}
.panel{border:1px solid var(--line);background:#171f23;border-radius:12px;padding:15px;margin-bottom:10px}
.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(154px,1fr));gap:8px;margin-top:10px}
.stage,.item{text-align:left}.stage strong,.item strong{display:block}.stage small{color:var(--amber)}.item{border:1px solid var(--line);padding:10px;border-radius:8px}.item h3{margin:0 0 4px}.item .row{margin-top:7px}.item button{font-size:12px}
#combat[hidden],[hidden]{display:none!important}body.fighting header,body.fighting nav{display:none}
.arena{position:relative;overflow:hidden;border-radius:8px;border:1px solid var(--line);background:#10181a;touch-action:none;user-select:none}
canvas{display:block;width:100%;aspect-ratio:900/580;max-height:62dvh;object-fit:contain}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:5px;padding:7px 0;font-size:13px}




.result{position:absolute;inset:0;display:grid;place-items:center;background:#10181ae8;padding:10px;text-align:center}.result article{padding:14px;max-width:430px}.result p{margin:8px 0}.result .row{justify-content:center}
#dash{background:var(--amber);color:#382510;font-weight:800;min-height:44px}
@media(max-height:500px) and (orientation:landscape){body.fighting main{padding:3px 8px}canvas{max-height:68dvh}}

#openSettings{min-height:44px;min-width:44px;font-size:22px}
#headerMenu{position:relative;flex-shrink:0}
#gameMenu{position:absolute;right:0;top:calc(100% + 5px);z-index:25;width:clamp(70px,20vw,132px);display:grid;gap:4px;padding:4px;border:1px solid var(--line);border-radius:10px;background:#172637;box-shadow:0 8px 20px #0008}
#gameMenu button{min-height:44px;padding:5px 2px;font-size:14px;white-space:nowrap}
.service-dialog{width:min(440px,calc(100% - 28px));max-height:85dvh;padding:16px;border:1px solid var(--line);border-radius:12px;background:#172637;color:var(--ink)}
.service-dialog::backdrop{background:#070e17b8}
.service-dialog button{min-height:44px;margin:4px 5px 4px 0}
.service-dialog label{display:grid;gap:5px;margin:9px 0}.service-dialog input{width:100%;min-height:39px;font:inherit}
.service-dialog .item{margin-bottom:8px}
#settings{width:min(420px,calc(100% - 28px));max-height:85dvh;padding:20px;color:#eef8fa;background:#19252d;border:1px solid #779ca8;border-radius:16px;box-sizing:border-box}
#settings::backdrop{background:#060d13c9}
#settings h2,#settings h3{margin:0 0 10px}
#settings label{display:block;font-weight:700;margin:14px 0}
#settings output{float:right;color:#a0f1d7}
#settings input[type=range]{display:block;width:100%;height:34px;accent-color:#70dfc5}
#settings button{min-height:44px}
#testModeForm{display:grid;gap:8px}
#testModeForm label{margin:0}
#testCode{min-width:0;min-height:44px;border:1px solid #779ca8;border-radius:6px;background:#101b23;color:inherit;font:inherit;padding:8px}
#testModeStatus{margin-top:8px}
.version-panel{border-top:1px solid #53636d;margin:18px 0 14px;padding-top:14px}
.selected-skill{border-color:var(--teal)}
details{margin:12px 0}
summary{cursor:pointer;min-height:44px;display:list-item;padding:10px 12px;border:1px solid var(--line);background:#20323b;border-radius:8px;font-weight:750}
details[open]>summary{border-color:var(--teal);margin-bottom:8px}
details .item{margin-bottom:8px}
.dungeon-cards{display:grid;gap:8px;margin-top:12px}
.dungeon-card{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 10px;padding:10px 12px}
.dungeon-category{color:var(--teal);font-size:12px;font-weight:800}
.dungeon-name{color:var(--text);font-size:18px;font-weight:800}
.dungeon-launch{min-height:44px;padding-inline:9px;white-space:nowrap}
.dungeon-picker{grid-column:1/-1;margin:4px 0 0}
.dungeon-picker summary{padding:7px 10px;min-height:36px;font-size:13px}
.dungeon-picker .grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:0}
.dungeon-picker button small{display:block;font-size:10px;line-height:1.2}

.dungeon-picker button{padding:7px 4px;min-height:44px;font-size:12px}
 .supply-reveal{--crate-accent:#80dfd1;min-height:186px;display:grid;justify-items:center;align-content:center;gap:4px;margin:14px 0;padding:12px;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:radial-gradient(ellipse at center,#2c454e,#141d28 73%);text-align:center}
 .supply-crate{position:relative;width:104px;height:68px;margin:22px 0 14px;border:3px solid #547f88;border-radius:10px;background:linear-gradient(110deg,#42616d,#223d48 65%);box-shadow:inset 0 8px #597c87,0 10px 18px #0c1824;transform-origin:50% 85%}
 .supply-crate::before{content:'';position:absolute;inset:17px 4px auto;border-top:3px solid #a3e2dd}
 .supply-crate::after{content:'';position:absolute;left:39%;top:12px;width:20%;height:23px;border:2px solid #c2f5eb;border-radius:4px;background:#529d9b}
 .crate-opening .supply-crate{animation:crate-unlock .85s both}
 .crate-opening .supply-crate::before{border-color:var(--crate-accent);box-shadow:0 0 10px var(--crate-accent)}
 .crate-beam{position:absolute;pointer-events:none;z-index:1;left:-18px;right:-18px;top:-75px;height:96px;opacity:0;background:linear-gradient(to top,var(--crate-accent),transparent 95%);clip-path:polygon(3% 0,97% 0,83% 100%,17% 100%);animation:crate-beam .85s ease-out both}
 @keyframes crate-beam{0%,20%{opacity:0;transform:scaleY(.35);transform-origin:bottom}75%,100%{opacity:.88;transform:scaleY(1);transform-origin:bottom}}
 .supply-actions{position:sticky;top:max(4px,env(safe-area-inset-top));z-index:3;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:12px 0;padding:6px;background:#17272f;border:1px solid #45616c;border-radius:10px}
 .supply-actions button{min-width:0;min-height:54px;padding:5px;font-weight:750}
 .supply-actions small{display:block;font-size:11px;font-weight:500}
 .supply-results{width:100%;display:grid;gap:8px}
 .supply-result{min-width:0;display:grid;gap:4px;justify-items:center;padding:6px}
 .supply-results-batch{grid-template-columns:repeat(2,minmax(0,1fr))}
 .supply-results-batch .supply-result{border:1px solid var(--crate-accent);border-radius:8px;background:#111b26}
 .supply-results-batch .supply-portrait{width:48px}
 .supply-results-batch .crate-name{font-size:14px}
 @media(min-width:620px){.supply-results-batch{grid-template-columns:repeat(5,minmax(0,1fr))}}
 .crate-revealed{border-color:var(--crate-accent);background:radial-gradient(ellipse at center,color-mix(in srgb,var(--crate-accent) 35%,#1b2634),#161e2a 75%);animation:crate-reveal .48s both}
 .crate-rare{box-shadow:inset 0 0 26px color-mix(in srgb,var(--crate-accent) 50%,transparent)}
 .supply-reveal .supply-portrait{width:84px;height:auto;aspect-ratio:1}
 .crate-rank{color:var(--crate-accent);font-weight:800}
 .crate-name{font-size:18px;font-weight:800}
 .supply-odds{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px}
 .supply-odds th,.supply-odds td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
 .supply-odds td:nth-child(-n+2),.supply-odds th:nth-child(-n+2){white-space:nowrap}
 @keyframes crate-unlock{0%{transform:rotate(0)}25%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}75%{transform:rotate(-5deg)}100%{transform:scale(1.12);filter:brightness(1.55)}}
 @keyframes crate-reveal{0%{opacity:.65;transform:scale(.95)}100%{opacity:1;transform:scale(1)}}
 @media(prefers-reduced-motion:reduce){.crate-opening .supply-crate,.crate-revealed{animation:none}}
.transcend-panel{border:1px solid #9f80ad;border-radius:10px;background:#27243a;padding:12px;margin-top:12px}
.transcend-panel .section-label{margin-top:0;color:#e2bbff}
.inventory-controls{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.inventory-controls label{display:grid;gap:3px;min-width:0;flex:1 1 120px;font-size:13px;color:var(--muted)}
.inventory-controls select{width:100%;min-height:44px}
</style>
</head>
<body><main>
<header><h1>심층 탄환</h1><button type="button" id="money" aria-label="재화와 수급처"></button><div id="headerMenu">
 <button type="button" id="openSettings" aria-label="메뉴" aria-expanded="false" aria-controls="gameMenu">☰</button>
 <div id="gameMenu" role="group" aria-label="메뉴 바로가기" hidden>
  <button type="button" id="menuSettings">설정</button>
  <button type="button" id="menuAccount">계정</button>
  <button type="button" id="menuMail">우편함</button>
  <button type="button" id="menuNotices">공지</button>
  <button type="button" id="menuRanking">순위</button>
 </div>
</div></header>
<section id="menu" aria-label="정비소"></section>
<nav id="dock" aria-label="정비소 메뉴">
  <button type="button" data-page="supply"><i class="dock-icon supply-icon" aria-hidden="true"></i><span>뽑기</span></button>
  <button type="button" data-page="gear"><i class="dock-icon equipment" aria-hidden="true"></i><span>장비</span></button>
  <button type="button" data-page="campaign"><i class="dock-icon combat" aria-hidden="true"></i><span>전투</span></button>
  <button type="button" data-page="growth"><i class="dock-icon growth" aria-hidden="true"></i><span>스킬 트리</span></button>
  <button type="button" data-page="contracts"><i class="dock-icon missions" aria-hidden="true"></i><span>던전</span></button>
</nav>
<section id="combat" hidden aria-label="전투">
<div class="hud" id="battleHud"><strong id="objective"></strong><span id="combatStats"></span><div class="life-track" id="lifeTrack" role="meter" aria-label="내 체력" aria-valuemin="0" aria-valuemax="100"><i></i><b></b></div><button id="pause">일시정지</button></div>
<div class="arena" id="arena"><canvas id="screen" width="900" height="580" aria-label="전투 지도"></canvas>
<div id="joystick" aria-hidden="true"><i></i></div>
<div id="result" class="result" hidden><article><h2 id="resultTitle"></h2><p id="resultText"></p><div class="row" id="resultActions"></div></article></div></div>
<p id="combatHint">화면을 끌어 이동 · 가까운 적 자동 사격</p>
<button id="reserveSkill">보조</button><button id="dash" aria-label="대시">대시</button>
</section>
<dialog id="settings" aria-labelledby="settingsTitle">
 <h2 id="settingsTitle">설정</h2>
 <label><input id="largeText" type="checkbox"> 큰 글씨</label>
 <label><input id="highContrast" type="checkbox"> 높은 대비</label>
 <label>효과음 <output id="effectsValue"></output><input id="effectsVolume" type="range" min="0" max="100" step="5"></label>
 <label>배경음 <output id="musicValue"></output><input id="musicVolume" type="range" min="0" max="100" step="5"></label>
 <button type="button" id="previewAudio">현재 총기 발사음 듣기</button>
 <p id="audioStatus" role="status"></p>
 <section class="version-panel" aria-labelledby="versionTitle">
  <h3 id="versionTitle">게임 업데이트</h3>
  <p id="updateStatus" role="status"></p>
  <div class="row"><button type="button" id="checkUpdate">최신 버전 확인</button><button type="button" id="applyUpdate">새로고침</button></div>
 </section>
 <details id="privateTest">
  <summary>테스트 모드</summary>
  <form id="testModeForm">
   <label for="testCode">비공개 코드</label>
   <input id="testCode" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" size="24" maxlength="40" required>
   <button type="submit" id="testModeStart">테스트 시작</button>
  </form>
  <button type="button" id="testModeExit" hidden>테스트 종료 · 원래 세이브로 복귀</button>
  <p id="testModeStatus" role="status"></p>
 </details>
 <form method="dialog"><button type="submit">닫기</button></form>
</dialog>

<dialog id="accountDialog" class="service-dialog" aria-labelledby="accountTitle">
 <h2 id="accountTitle">계정</h2>
 <p id="accountStatus" role="status"></p>
 <div id="accountActions"></div>
 <form method="dialog"><button>닫기</button></form>
</dialog>
<dialog id="mailDialog" class="service-dialog" aria-labelledby="mailTitle">
 <h2 id="mailTitle">우편함</h2>
 <p id="mailStatus" role="status"></p>
 <div id="mailItems"></div>
 <form method="dialog"><button>닫기</button></form>
</dialog>
<dialog id="noticesDialog" class="service-dialog" aria-labelledby="noticeTitle">
 <h2 id="noticeTitle">공지</h2>
 <p>4.0.0 · 마지막 교신</p>
 <p>폐광에서 구조 신호가 도착했어. 전투 홈의 마지막 교신에서 작전을 선택해.</p>
 <form method="dialog"><button>닫기</button></form>
</dialog>
<dialog id="rankingDialog" class="service-dialog" aria-labelledby="rankingTitle">
 <h2 id="rankingTitle">유저 순위 비교</h2>
 <p id="rankingStatus" role="status"></p>
 <div id="rankingItems"></div>
 <form method="dialog"><button>닫기</button></form>
</dialog>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const build=document.querySelector('meta[name="game-build"]').content;
const settingsKey='deep-rounds-settings-v1';
let audioSettings={effects:65,music:25};
try{
 const stored=JSON.parse(localStorage.getItem(settingsKey));
 for(const name of Object.keys(audioSettings)){
  if(Number.isFinite(stored?.[name]))audioSettings[name]=Math.max(0,Math.min(100,stored[name]));
 }
}catch{}
let audioContext,effectsGain,musicGain;
async function enableAudio(){
 const Audio=window.AudioContext||window.webkitAudioContext;
 if(!Audio)return false;
 try{
  if(!audioContext){
   audioContext=new Audio();
   effectsGain=audioContext.createGain();effectsGain.connect(audioContext.destination);
   musicGain=audioContext.createGain();musicGain.connect(audioContext.destination);
   setVolume();
  }
  if(audioContext.state!=='running')await audioContext.resume();
  return audioContext.state==='running';
 }catch{return false;}
}
function setVolume(){
 if(!audioContext)return;
 effectsGain.gain.setTargetAtTime(audioSettings.effects/100,audioContext.currentTime,.02);
 musicGain.gain.setTargetAtTime(audioSettings.music/100,audioContext.currentTime,.02);
}
function tone(output,frequency,end,duration,amplitude,type='sine',delay=0){
 if(audioContext?.state!=='running'||document.hidden)return;
 const at=audioContext.currentTime+delay;
 const oscillator=audioContext.createOscillator(),envelope=audioContext.createGain();
 oscillator.type=type;
 oscillator.frequency.setValueAtTime(frequency,at);
 oscillator.frequency.exponentialRampToValueAtTime(end,at+duration);
 envelope.gain.setValueAtTime(.001,at);
 envelope.gain.exponentialRampToValueAtTime(amplitude,at+.012);
 envelope.gain.exponentialRampToValueAtTime(.001,at+duration);
 oscillator.connect(envelope);envelope.connect(output);
 oscillator.start(at);oscillator.stop(at+duration+.02);
}
const gunSounds={
 pistol:[430,170,.065,.085,'triangle'],revolver:[360,140,.08,.095,'triangle'],
 rifle:[470,205,.05,.063,'triangle'],smg:[510,240,.043,.055,'triangle'],
 shotgun:[330,125,.082,.105,'triangle'],sniper:[390,155,.09,.095,'triangle'],rail:[680,235,.085,.075,'sine']
};
function playGunshot(id){
 if(audioSettings.effects<=0)return;
 const sound=gunSounds[id];
 tone(effectsGain,...sound);
 const accents={pistol:[1.7,.020,'triangle'],revolver:[.55,.065,'sine'],rifle:[2.4,.017,'square'],smg:[1.3,.014,'triangle'],shotgun:[.42,.078,'sawtooth'],sniper:[2.1,.042,'sine'],rail:[1.9,.09,'sine']};
 const [ratio,duration,wave]=accents[id];
 tone(effectsGain,sound[0]*ratio,sound[1]*ratio,duration,sound[3]*.22,wave);
}
const soundProfiles={
 dash:[120,470,.15,.13,'triangle'],volley:[550,180,.12,.11,'square'],
 charge:[180,850,.22,.12,'triangle'],heal:[390,680,.37,.11,'sine'],
 storm:[520,85,.32,.12,'sawtooth'],shield:[270,430,.28,.10,'sine'],
 pulse:[580,135,.29,.13,'triangle'],overdrive:[110,420,.32,.11,'sawtooth'],hurt:[105,48,.2,.18,'sawtooth'],
 boss:[63,47,.65,.23,'triangle'],win:[330,440,.31,.16,'triangle'],
 lose:[210,58,.43,.16,'triangle'],
 crate:[105,220,.35,.16,'triangle'],crateReveal:[440,660,.38,.16,'triangle'],crateRare:[440,1100,.65,.22,'triangle']
};
function playEffect(name){
 if(audioSettings.effects>0)tone(effectsGain,...soundProfiles[name]);
}
let beat=0;
setInterval(()=>{
 if(audioSettings.music<=0||!game||game.over||game.paused||$('combat').hidden||document.hidden||audioContext?.state!=='running')return;
 const notes=[55,55,65.41,55,49,49,73.42,65.41];
 const note=notes[beat++%notes.length];
 tone(musicGain,note,note,.46,.18);
 if(beat%2===0)tone(musicGain,note*4,note*4,.26,.07,'triangle',.14);
},480);

for(const name of Object.keys(audioSettings)){
 const slider=$(name+'Volume'),value=$(name+'Value');
 slider.value=audioSettings[name];value.textContent=slider.value+'%';
 slider.oninput=()=>{
  audioSettings[name]=Number(slider.value);value.textContent=slider.value+'%';
  setVolume();
  try{localStorage.setItem(settingsKey,JSON.stringify(audioSettings));}catch{}
 };
}
$('previewAudio').onclick=async()=>{
 const status=$('audioStatus');
 if(!audioSettings.effects){status.textContent='효과음 볼륨을 0%보다 높여 줘.';return;}
 if(!await enableAudio()){status.textContent='소리를 켜지 못했어. 버튼을 다시 눌러 줘.';return;}
 playGunshot(gearFamily(save.equipped.gun||'pistol'));
 status.textContent='현재 장착한 총기 발사음 재생';
};
const updateStatus=$('updateStatus');
const checkUpdate=$('checkUpdate'),applyUpdate=$('applyUpdate');
updateStatus.textContent='현재 버전 '+build;
checkUpdate.onclick=async()=>{
 checkUpdate.disabled=true;applyUpdate.disabled=true;
 updateStatus.textContent='최신 배포 버전 확인 중…';
 try{
  const url=new URL('shooter.html',location.href);
  url.searchParams.set('check',Date.now());
  const response=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(10000)});
  if(!response.ok)throw new Error('Version check failed');
  const page=new DOMParser().parseFromString(await response.text(),'text/html');
  const latest=page.querySelector('meta[name="game-build"]')?.content;
  if(!latest)throw new Error('Version unavailable');
  applyUpdate.textContent=latest===build?'새로고침':'업데이트 적용';
  updateStatus.textContent=latest===build?'최신 버전 '+build:'현재 '+build+' · 최신 '+latest;
 }catch{
  updateStatus.textContent='현재 '+build+' · 확인에 실패했어. 잠시 후 다시 확인해 줘.';
 }finally{
  checkUpdate.disabled=false;applyUpdate.disabled=false;
 }
};
applyUpdate.onclick=()=>{
 const url=new URL(location.href);
 url.searchParams.delete('v');
 url.searchParams.set('refresh',Date.now());
 location.replace(url.href);
};
const stages=[
 ['광산 입구','clear',12],['버려진 선로','destroy',3,'cart'],['포자 굴','survive',90],['장갑 갱도','armor',3],
 ['굴착장 · 철턱','boss',1],['좁은 굴','clear',24],['무너지는 갱도','switch',2,'rock'],['폭발 둥지','destroy',3,'blast'],
 ['승강기 방어','defend',90],['폐광 최심부 · 광맥 포식자','boss',1,'rock'],
 ['침수된 로비','clear',22,'water'],['배수 통로','switch',2,'water'],['누전 실험실','switch',3,'shock'],

function rollSupply(random,tiers){
 let ticket=Math.floor(random()*10000);
 const tier=tiers.find(group=>(ticket-=group.tickets)<0);
 const id=tier.items[Math.floor(random()*tier.items.length)];
 const previousRank=own(id)?grade(id):0;
 const outcome=previousRank===0?'new':tier.rank>previousRank?'promoted':'duplicate';
 if(outcome==='duplicate'){
  save.parts+=1;
  save.copies[id]??={};
  save.copies[id][tier.rank]=(save.copies[id][tier.rank]||0)+1;
 }
 else{
  unlock(id);
  save.ranks[id]=tier.rank;
 }
 return {id,rank:tier.rank,previousRank,outcome};
}
function drawSupplies(count,random=Math.random){
 const stage=supplyStage(),price=supplyPrice(stage)*count;
 if((count!==1&&count!==10)||save.credits<price)return null;
 save.credits-=price;
 const tiers=supplyOdds(stage);
 const cards=Array.from({length:count},()=>rollSupply(random,tiers));
 save.supplyOpened=(save.supplyOpened||0)+count;
 save.supplyHistory=[...cards.map(({id,rank,outcome})=>({id,rank,outcome})).reverse(),...(save.supplyHistory||[])].slice(0,30);
 persist();
 return {cards,highest:Math.max(...cards.map(card=>card.rank)),skipped:false};
}

const inventorySorts={slot:'종류별 보기',rarity:'희귀도순 보기',level:'장비 레벨순 보기'};
const slotOrder=Object.keys(slots);
function inventoryGroups(mode,filter){
 const groups=new Map();
 const view=save.inventoryView;
 for(const [id,item] of Object.entries(gear)){
  if(!own(id)||(filter&&item.slot!==filter))continue;
  if(view==='stored'?!itemStored(id):itemStored(id)&&!equippedId(id))continue;
  if(view==='equipped'&&!equippedId(id))continue;
  if(view==='upgrade'&&(level(id)>=maxGearLevel(id)||!available(costs(id))&&!available(gearMaterialPrice(id))))continue;
  if(view==='transcend'&&(transcendLevel(id)>=transcendCap||!testMode&&transcendMaterials(id,grade(id)).reduce((n,source)=>n+source.count,0)<=transcendLevel(id)))continue;
  const rank=grade(id),key=item.slot+':'+rank;
  if(!groups.has(key))groups.set(key,{slot:item.slot,rank,maxLevel:0,ids:[]});
  const group=groups.get(key);
  group.ids.push(id);
  group.maxLevel=Math.max(group.maxLevel,level(id));
 }
 const bySlot=(a,b)=>slotOrder.indexOf(a.slot)-slotOrder.indexOf(b.slot);
 const byRank=(a,b)=>b.rank-a.rank;
 const sorted=[...groups.values()].sort((a,b)=>{
  if(mode==='level')return b.maxLevel-a.maxLevel||byRank(a,b)||bySlot(a,b);
  if(mode==='rarity')return byRank(a,b)||bySlot(a,b);
  return bySlot(a,b)||byRank(a,b);
 });
 for(const group of sorted){
  group.ids.sort((a,b)=>transcendLevel(b)-transcendLevel(a)||level(b)-level(a)||gear[a].name.localeCompare(gear[b].name,'ko'));
 }
 return sorted;
}

function salvageReward(rank){
 return {credits:rank*8,alloy:Math.ceil(rank/2)};
}
function dismantle(id,rank,copy,count=1){
 if(!own(id)||itemLocked(id)||!Number.isInteger(rank)||rank<1||rank>6)return false;
 if(copy){
  if(!Number.isInteger(count)||count<1||!(save.copies[id]?.[rank]>=count))return false;
  save.copies[id][rank]-=count;
 }else{
  if(grade(id)!==rank||id==='pistol'||save.equipped[gear[id].slot]===id||Object.values(save.copies[id]||{}).some(n=>n>0))return false;
  for(const field of ['levels','ascension','ranks','mods','copies','itemStorage','upgradeLedger'])if(save[field])delete save[field][id];
  save.salvaged[id]=true;
 }
 const reward=salvageReward(rank);
 addFunds({credits:reward.credits*count,alloy:reward.alloy*count});
 return true;
}

function drawSkillFlash(effect,p){

   ctx.strokeStyle='#fff6d8';ctx.lineWidth=2;ray(x,y,end.x,end.y);

const equipmentProfiles={'balanced':'균형형','attack':'공격형','defense':'생존형'};
function equipmentScore(id,profile,stage=recommendationStage??Math.min(save.cleared,stages.length-1)){
 if(!id)return 0;
 const item=gear[id],upgrade=level(id),rank=grade(id),stars=transcendLevel(id);
 if(item.slot==='gun'){
  const active=item.mag*item.interval;
  const dps=item.damage*gearPower(id)*(1+.038*(rank-1))*(item.base==='shotgun'||id==='shotgun'?2.3:1)*
   item.mag/(active+item.reload);
  return (dps*.6+stars*3)*(profile==='attack'?1.45:profile==='defense'?.82:1);
 }
 const armor=item.slot==='head'||item.slot==='armor';
 const resistance=item.slot==='armor'&&itemElement(id)===stage%5?(profile==='defense'?18:12):0;
 return (3+rank*2+upgrade*.8+stars*2+resistance)*(armor&&profile==='defense'?1.45:1);
}
function loadoutScore(items,profile){
 let score=Object.values(items).reduce((total,id)=>total+equipmentScore(id,profile),0);
 const effects=setBonuses(items);
 const attack=effects.damage+effects.fire+effects.reload*.5+effects.projectile*.22;
 score+=attack*(profile==='attack'?145:105)+effects.defense*(profile==='defense'?170:115)+effects.move*90+effects.cooldown*100;
 return score;
}
function recommendEquipment(profile='balanced',fixed=[]){
 const options=Object.keys(slots).map(slot=>{
  if(fixed.includes(slot)&&save.equipped[slot])return [slot,[save.equipped[slot]]];
  const bestByTheme=new Map();
  for(const [id,item] of Object.entries(gear)){
   if(item.slot!==slot||!own(id)||(itemStored(id)&&!equippedId(id)))continue;
   const theme=item.theme||'';
   if(!bestByTheme.has(theme)||equipmentScore(id,profile)>equipmentScore(bestByTheme.get(theme),profile))bestByTheme.set(theme,id);
  }
  return [slot,[...bestByTheme.values()]];
 });
 let best={...save.equipped},score=loadoutScore(best,profile);
 const candidate={};
 function visit(index){
  if(index===options.length){
   const next=loadoutScore(candidate,profile);
   if(next>score+.001){best={...candidate};score=next;}
   return;
  }
  const [slot,ids]=options[index];
  if(!ids.length){visit(index+1);return;}
  for(const id of ids){candidate[slot]=id;visit(index+1);}
 }
 visit(0);return best;
}

function targetUpgradeCost(id){

 for(let next=level(id)+1;next<=target;next++){
  for(const [key,value] of Object.entries(costs(id,next)))total[key]=(total[key]||0)+value;
 }
 return {target,total};
}

function cardSet(ids,seed){
 let n=seed>>>0;
 const arr=ids.slice();
 for(let i=arr.length-1;i>0;i--){
  n=(Math.imul(n,1664525)+1013904223)>>>0;
  const j=n%(i+1);[arr[i],arr[j]]=[arr[j],arr[i]];
 }
 return arr;
}
function modLaunch(code,site=''){
 const url=new URL('shooter.html',location.href);url.searchParams.set('op',code);
 if(site)url.searchParams.set('site',site);

}
function newOp(index){return 'Q'+index+'-'+crypto.getRandomValues(new Uint32Array(1))[0].toString(36).toUpperCase();}
function modPick(g){
 const m=g.mod,first=!m.core;
 const pool=first?cardSet(Object.keys(coreCards),m.seed):[coreCards[m.core][2],...cardSet(Object.keys(extraCards).filter(x=>x!==coreCards[m.core][2]),m.seed+19)];
 const cards=first?coreCards:extraCards;
 g.paused=true;m.choosing=true;releaseStick();keys.clear();$('pause').disabled=true;
 $('resultTitle').textContent=first?'신호 수신 · 핵심 능력':'회로 복구 · 추가 능력';
 $('resultText').textContent=first?'“내 신호가 들리면, 단말에 회로를 하나 꽂아.” — 정거장 기사 윤':'“이제 돌아갈 길을 만들어. 마지막 구역에 생존자가 있어.”';
 const row=$('resultActions');row.replaceChildren();
 for(const id of pool.slice(0,3)){
  const card=largeEntry(cards[id][0]+(!first&&id===pool[0]?' · 연계':''),cards[id][1],()=>{
   m[first?'core':'extra']=id;m.choosing=false;g.paused=false;
   if(id==='pad'&&!g.terrain.some(o=>o.kind==='vent'))g.terrain.push({x:g.p.x,y:g.p.y,kind:'vent',r:24});
   $('pause').disabled=false;$('result').hidden=true;frameRemainder=0;
   $('combatHint').textContent=[coreCards[m.core]?.[0],extraCards[m.extra]?.[0]].filter(Boolean).join(' + ');
  });
  const symbols={echo:'◐',ice:'❄',mushroom:'♧',pad:'⇥',gravity:'◎',sleep:'☾',knot:'∞',stars:'✧',burst:'✴',frost:'❅',charge:'ϟ',opening:'◇'};
  card.dataset.sigil=symbols[id];row.append(card);
 }
 $('result').hidden=false;
}
function sigil(g,kind,pos,r,life){
 const marks=g.mod.marks;
 if(marks.length>=32)marks.shift();
 const mark={kind,x:pos.x,y:pos.y,r,until:g.t+life};marks.push(mark);return mark;
}
function scatter(g,at,r){
 for(const e of g.enemies)if(e.type!=='boss'&&dist(e,at)<r){
  const a=angle(at,e);for(let i=0;i<6;i++)move(e,Math.cos(a)*9,Math.sin(a)*9);
  e.stun=Math.max(e.stun,.45);
 }
 skillFlash('pulse',at,r);
}
function modDash(g){
 const m=g.mod,p=g.p;
 m.endpoint=true;
 if(m.core==='echo'){m.echo={...p,path:m.history.map(v=>({...v})),time:0};}
 if(m.core==='knot'){m.marks=m.marks.filter(a=>a.kind!=='knot');sigil(g,'knot',p,23,4);}
 if(m.core==='pad')m.carry=g.terrain.find(o=>o.kind==='vent'&&dist(o,p)<o.r+18);
 if(m.core==='gravity'){
  const side=e=>Math.sin(angle(p,e)-p.dashDir);
  const near=g.enemies.filter(e=>e.type!=='boss'&&dist(e,p)<175);
  const pair=[near.find(e=>side(e)<0),near.find(e=>side(e)>=0)];
  if(pair.every(Boolean)){
   const mid={x:(pair[0].x+pair[1].x)/2,y:(pair[0].y+pair[1].y)/2};
   for(const e of pair){const a=angle(e,mid),length=dist(e,mid);for(let i=0;i<10;i++)move(e,Math.cos(a)*length/10,Math.sin(a)*length/10);e.hp-=40;e.stun=.7;}
   skillFlash('volley',pair[0],20,pair[1]);
  }
 }
}
function modKill(g,e){
 const m=g.mod;
 if(m.core==='mushroom')sigil(g,'mushroom',e,21,28);
 if(m.extra==='frost')sigil(g,'ice',e,45,2.4);
 if(m.core==='sleep'){
  const next=g.enemies.filter(x=>x.hp>0&&x.type!=='boss'&&dist(x,e)<240).sort((a,b)=>dist(a,e)-dist(b,e))[0];
  if(next){next.sleepUntil=g.t+2.6;skillFlash('volley',e,18,next);}
 }
}
function modTick(g,dt){
 const m=g.mod,p=g.p;
 if(g.t>=m.sample){m.history.push({x:p.x,y:p.y});if(m.history.length>21)m.history.shift();m.sample=g.t+.1;}
 if(m.echo){
  m.echo.time+=dt;const loc=m.echo.path[Math.floor(m.echo.time*10)];
  if(loc)Object.assign(m.echo,loc);else{if(m.extra==='burst')scatter(g,m.echo,125);m.echo=null;}
 }
 if(m.core==='ice'&&p.dash>0&&g.t>=(m.trailAt||0)){sigil(g,'ice',p,32,2.2);m.trailAt=g.t+.04;}
 if(m.endpoint&&p.dash<=0){
  m.endpoint=false;if(m.carry){m.carry.x=p.x;m.carry.y=p.y;m.carry=null;}
  if(m.extra==='burst')scatter(g,p,105);
 }
 if(m.extra==='charge'&&g.t>=(m.chargeAt||0)&&g.terrain.some(o=>o.kind==='vent'&&dist(p,o)<o.r+15)){p.cd=Math.max(0,p.cd-2);m.chargeAt=g.t+5;}
 for(const a of m.marks){
  if(a.kind==='mushroom'&&dist(p,a)<30){scatter(g,a,m.extra==='burst'?160:116);a.until=0;}
  if(a.kind==='knot'){if(dist(p,a)>39)a.armed=true;if(a.armed&&dist(p,a)<25){p.cd=0;a.until=0;}}
  if(a.kind==='ice')for(const e of g.enemies)if(e.type!=='boss'&&dist(e,a)<a.r)e.chillUntil=g.t+.25;
 }
 m.marks=m.marks.filter(a=>a.until>g.t);
 if(m.core==='stars'){
  if(!m.stars&&g.t>=(m.starAt||0)){
   m.stars=[[.25,.45],[.52,.24],[.72,.67]].map(([x,y])=>{const pt={x:x*W,y:y*H};while(blocked(pt.x,pt.y,18))pt.y+=12;return pt;});m.star=0;
  }
  if(m.stars&&m.star<3&&dist(p,m.stars[m.star])<34){
   if(++m.star===3){m.starEnd=g.t+6;skillFlash('pulse',p,66);}
  }
  if(m.star===3&&m.stars){
   const cross=(a,b,c)=>(b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x);
   for(const e of g.enemies)if(e.type!=='boss'&&m.stars.every((v,i)=>cross(v,m.stars[(i+1)%3],e)>=0))e.chillUntil=g.t+.25;
   if(g.t>m.starEnd){m.stars=null;m.starAt=g.t+2;}
  }
 }
}
function drawMod(g){
 const m=g.mod;if(!m)return;
 for(const a of m.marks){
  const color={ice:'#82dfff',mushroom:'#ffa9dc',knot:'#ffd98a'}[a.kind];
  disc(a.x,a.y,a.r,color+'55');disc(a.x,a.y,6,color);
 }
 if(m.echo)disc(m.echo.x,m.echo.y,16,'#b597ffb0');
 if(m.stars){
  ctx.beginPath();m.stars.forEach((v,i)=>i?ctx.lineTo(v.x,v.y):ctx.moveTo(v.x,v.y));ctx.closePath();ctx.strokeStyle='#ffe78b';ctx.stroke();
  if(m.star===3){ctx.fillStyle='#ffe78b33';ctx.fill();}
  m.stars.forEach((v,i)=>disc(v.x,v.y,i===m.star?20:10,i<=m.star?'#ffe691':'#827da1'));
 }
}
function modResult(g,won,row){

 const recordKey='signal-best-'+m.code;
 const time=Math.round(g.t*10)/10,old=readSave(recordKey);
 let record='';

 localStorage.setItem(recordKey,JSON.stringify(best));record='최단 '+best.time+'초 / 최소 피격 '+best.hits+'회';}
 if(won&&site&&({'station':1,'cave':9,'lab':14})[site]===g.index)localStorage.setItem('signal-clear-'+site,'1');
 $('resultTitle').textContent=won?'신호 복구 성공':'구조 신호 끊김';
 $('resultText').textContent=[Math.round(g.t)+'초','피격 '+g.hits+'회',coreCards[m.core]?.[0],extraCards[m.extra]?.[0],'도전 코드 '+m.code,record].filter(Boolean).join(' · ');
 row.append(button('코드 복사',async()=>{try{await navigator.clipboard.writeText(m.code);$('resultText').textContent+=' · 복사됨';}catch{window.prompt('도전 코드를 복사해.',m.code);}}));

 $('result').hidden=false;
}
