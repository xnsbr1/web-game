<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#091c25">
<title>폭풍등 구조대</title>
<link rel="stylesheet" href="art.css"><link rel="stylesheet" href="style.css">
<script defer src="game.js"></script>
</head>
<body>
<main id="home">
 <section class="brief">
 <p class="eyebrow">폭풍 부두 · 4분 생존</p>
 <h1>폭풍등<br>구조대</h1>
 <p class="lead">불씨를 모아 장비를 융합하고, 닻등 게를 쓰러뜨려 부두를 되찾으세요.</p>
 <fieldset id="crew"><legend>구조대원 선택</legend><div id="crew-options"></div></fieldset>
 <button class="primary" id="start">부두로 출동 <span>→</span></button>
 <p id="record"></p>
 <details><summary>장비와 융합</summary><div id="catalog"></div></details>
 </section>
</main>
<section id="battle" hidden>
 <canvas id="field" aria-label="폭풍 부두 전투 화면"></canvas>
 <header class="hud"><div><strong id="time">0:00</strong><small id="event">불씨 수집</small></div><div class="vitals"><div id="hp"></div><div id="xp"></div><small id="stats"></small></div><button id="pause" aria-label="일시 정지">Ⅱ</button></header>
 <div id="loadout"></div>
 <p id="hint">화면을 끌어 이동 · 공격은 자동</p>
 <button id="crane" hidden>크레인 작동</button>
</section>
<section id="overlay" hidden><div class="panel"><p class="eyebrow" id="over-tag"></p><h2 id="over-title"></h2><div id="choices"></div></div></section>
</body>
</html>
