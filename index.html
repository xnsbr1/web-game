<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111b1a">
<title>녹안 협곡 | 타워 디펜스</title>
<style>
:root{color-scheme:dark;--ink:#f3efdd;--muted:#a8b8a9;--panel:#1b2926;--outline:#3a4a41;--mint:#c9ea94;--gold:#f2c574}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#273832 0,transparent 65%),#111b1a;color:var(--ink);font:15px/1.45 system-ui,-apple-system,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid #fff3af;outline-offset:3px}
button:disabled{opacity:.48;cursor:default}
.shell{width:min(1200px,100%);margin:auto;padding:28px clamp(12px,3.3vw,39px) 32px}
header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:20px}
h1,h2,p{margin:0}
h1{font-size:clamp(27px,4.8vw,47px);line-height:1;letter-spacing:-.07em}
.brand{display:flex;align-items:center;gap:13px}
.crest{width:42px;height:47px;display:grid;place-items:center;background:var(--mint);color:#273526;clip-path:polygon(0 0,100% 0,100% 74%,50% 100%,0 74%);font-size:23px;font-weight:900}
.subtitle{margin-top:7px;color:var(--muted);font-size:12px}
.stats{display:flex;gap:6px;align-items:stretch}
.stat{min-width:78px;border:1px solid var(--outline);background:#182522;border-radius:9px;padding:6px 10px;text-align:center}
.stat span{display:block;color:var(--muted);font-size:11px;white-space:nowrap}
.stat strong{font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
#gold{color:var(--gold)}#health{color:#ffab96}
main{display:grid;grid-template-columns:minmax(0,1fr) 263px;gap:13px;align-items:start}
.board{overflow:hidden;border:1px solid #526451;border-radius:13px;background:#243c30;box-shadow:0 14px 45px #080d0b55}
.field{position:relative;aspect-ratio:720/520}
canvas{display:block;width:100%;height:100%}
.pads{position:absolute;inset:0}
.pad{position:absolute;transform:translate(-50%,-50%);width:8.6%;height:12%;border:0;background:transparent;border-radius:50%;padding:0}
.pad:focus-visible{outline-offset:-2px}
.field-label{position:absolute;pointer-events:none;text-transform:uppercase;color:#f1f0d6;letter-spacing:.13em;font-size:clamp(8px,1.3vw,11px);font-weight:850;background:#142420de;border:1px solid #a6bd9d66;padding:3px 7px;border-radius:4px}
.entrance{top:7%;left:2%}.base{right:2%;bottom:12%}
.overlay{position:absolute;inset:0;background:#0e1917c9;display:grid;place-items:center;text-align:center;z-index:1}
.overlay[hidden]{display:none}
.result{padding:22px;border:1px solid var(--outline);border-radius:12px;background:#1b2926;min-width:220px}
.result h2{font-size:24px}.result p{margin:6px 0 14px;color:var(--muted)}
.board-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;background:#192622}
#status{font-size:12px;color:#ccdbbf}
.tempo{display:flex;gap:5px;flex-shrink:0}
.quiet{background:#273832;border:1px solid #4a5a4c;border-radius:6px;padding:5px 8px;font-size:12px}
aside{background:var(--panel);border:1px solid var(--outline);padding:13px;border-radius:13px}
aside h2{font-size:15px;margin:0 0 8px}
.cards{display:grid;gap:6px}
.card{display:grid;grid-template-columns:30px 1fr auto;gap:7px;align-items:center;text-align:left;border:1px solid #42534a;background:#263731;border-radius:8px;padding:8px;min-height:52px;width:100%}
.card[aria-pressed=true]{border-color:#bcdc87;background:#364a34}
.icon{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;background:#182922;color:var(--tower);font-size:19px}
.card b{font-size:13px;display:block}.card small{color:var(--muted);display:block;font-size:10px}.price{color:var(--gold);font-size:12px}
.detail{min-height:62px;padding:9px 1px;color:#c1d0bd;font-size:12px}
.detail strong{color:var(--ink)}
.detail-actions{display:flex;gap:5px;margin-top:5px}
.primary{border:0;background:var(--mint);color:#202c1d;font-weight:850;border-radius:7px;padding:10px 12px;width:100%}
.primary:not(:disabled):hover{background:#e1ffad}
.progress{margin:10px 0 7px;height:4px;background:#34453d;border-radius:9px;overflow:hidden}
.progress span{display:block;height:100%;background:#b3d785;width:0;transition:width .18s}
#best{color:var(--muted);font-size:11px}
@media(max-width:760px){main{grid-template-columns:minmax(0,1fr)}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.detail{min-height:36px}aside{padding:10px}header{margin-bottom:12px}.shell{padding-top:14px}}
@media(max-width:475px){.crest{width:29px;height:34px;font-size:17px}.brand{gap:6px}.subtitle{display:none}header{gap:5px}.stat{min-width:44px;padding:3px 4px}.stat span{font-size:9px}.stat strong{font-size:14px}.stats{gap:3px}.card{grid-template-columns:21px 1fr;gap:3px;padding:5px;min-height:48px}.icon{width:19px;height:22px;font-size:14px}.card small{display:none}.price{grid-column:2;font-size:10px;line-height:1}.board-footer{padding:6px}.quiet{padding:4px 6px}#status{font-size:11px}.shell{padding-inline:8px}}
.workshop{border-bottom:1px solid var(--outline);padding-bottom:12px;margin-bottom:12px}.workshop p{font-size:12px;color:var(--gold);margin:8px 0}.workshop button{min-height:34px}#rail[hidden]{display:none}</style>
</head>
<body>
<div class="shell">
<header>
  <div class="brand"><div class="crest" aria-hidden="true">◆</div><div><h1 id="region">녹안 협곡</h1><p class="subtitle">협곡을 지나오는 적으로부터 요새를 지켜라</p></div></div>
  <div class="stats">
    <div class="stat"><span>웨이브</span><strong id="wave">0 / 10</strong></div>
    <div class="stat"><span>골드</span><strong id="gold">160</strong></div>
    <div class="stat"><span>요새 체력</span><strong id="health">15</strong></div>
  </div>
</header>
<main>
  <section class="board" aria-label="전장">
    <div class="field">
      <canvas id="map" width="720" height="520" aria-hidden="true"></canvas>
      <div class="pads" id="pads"></div>
      <span class="field-label entrance">적 진입</span><span class="field-label base">요새</span>
      <div class="overlay" id="overlay" hidden><div class="result"><h2 id="resultTitle"></h2><p id="resultText"></p><button type="button" class="primary" id="restart">다시 시작</button></div></div>
    </div>
    <div class="board-footer">
      <p id="status" role="status">타워를 고르고 지도에 있는 +를 눌러 설치해.</p>
      <div class="tempo"><button type="button" class="quiet" id="speed" aria-label="배속 변경">1×</button><button type="button" class="quiet" id="pause" disabled>일시정지</button></div>
    </div>
  </section>
  <aside aria-label="타워와 웨이브 조작">
    <section class="workshop"><h2>원정 · 대장간</h2><button class="quiet" id="travel"></button> <button class="quiet" id="rail" hidden></button><p id="oreCount"></p><button class="quiet" id="forge"></button></section><h2>타워 건설</h2>
    <div class="cards" id="cards"></div>
    <div class="detail" id="detail"></div>
    <button type="button" class="primary" id="launch">웨이브 1 시작</button>
    <div class="progress" aria-hidden="true"><span id="progress"></span></div>
    <p id="best"></p>
  </aside>
</main>
</div>
<script>
'use strict';

const MAX_WAVE = 10;
const route = [[-20,97],[143,97],[143,216],[320,216],[320,93],[560,93],[560,275],[428,275],[428,421],[746,421]];
const pads = [[72,153],[199,148],[222,270],[269,154],[374,154],[432,43],[490,148],[614,163],[502,217],[613,296],[376,328],[493,344],[369,451],[559,362],[628,464]];
const types = {
  arrow: { name:'활탑', icon:'➶', description:'빠른 단일 공격', color:'#c9eb8d', cost:55, range:112, damage:13, interval:.58 },
  cannon: { name:'포탑', icon:'✹', description:'범위 피해', color:'#ffbd75', cost:95, range:119, damage:29, interval:1.5 },
  frost: { name:'서리탑', icon:'❄', description:'적 이동속도 감소', color:'#91def1', cost:75, range:110, damage:8, interval:.95 }
};
const enemies = {
  scout: { hp:33, speed:68, reward:9, radius:9, color:'#f2a769', damage:1 },
  runner: { hp:23, speed:104, reward:10, radius:7, color:'#e9d476', damage:1 },
  guard: { hp:96, speed:49, reward:17, radius:12, color:'#e0898e', damage:1 },
  boss: { hp:405, speed:37, reward:60, radius:17, color:'#e5a4f1', damage:3 }
};
const valleyRoute = route.slice();
const mineRoutes = [
  [[-20,97],[143,97],[143,216],[560,216],[560,275],[428,275],[428,421],[746,421]],
  [[-20,97],[320,97],[320,216],[560,216],[560,355],[428,355],[428,421],[746,421]]
];
let mine = false;
let track = 0;
let forgeSave = {ore:0, level:0};
try {
  const saved = JSON.parse(localStorage.getItem('greenwatch-forge') || '{}');
  for (const key of ['ore','level']) if (Number.isSafeInteger(saved[key]) && saved[key]>=0) forgeSave[key]=saved[key];
  forgeSave.level=Math.min(5,forgeSave.level);
} catch {}
function saveForge() {
  try { localStorage.setItem('greenwatch-forge',JSON.stringify(forgeSave)); } catch {}
}
const segments = [];
let routeLength = 0;
function buildRoute() {
segments.length = 0;
routeLength = 0;
route.splice(0,route.length,...(mine ? mineRoutes[track] : valleyRoute));
route.slice(1).forEach(([x,y], index) => {
  const [fromX,fromY] = route[index];
  const length = Math.hypot(x-fromX,y-fromY);
  segments.push({fromX,fromY,x,y,length,start:routeLength});
  routeLength += length;
});
}
buildRoute();
const byId = id => document.getElementById(id);
const canvas = byId('map');
const ctx = canvas.getContext('2d');
const terrain = document.createElement('canvas');
terrain.width = canvas.width;
terrain.height = canvas.height;
const cards = {};
const padButtons = [];
const detail = byId('detail');
let best = 0;
try { best = Number(localStorage.getItem('greenwatch-best')) || 0; } catch {}
let game;
let detailMarkup = '';
let elapsed = 0;
let lastFrame = 0;

function reset() {
  game = {
    wave:0, cleared:0, gold:160, hp:15, towers:Array(pads.length).fill(null), enemies:[],
    queue:[], effects:[], spawnTimer:0, spawned:0, total:0, phase:'ready', speed:1, paused:false,
    type:'arrow', selected:-1, status:'타워를 고르고 지도에 있는 +를 눌러 설치해.'
  };
  byId('overlay').hidden = true;
  sync();
}

function sync() {
  byId('region').textContent = mine ? '폐철광산' : '녹안 협곡';
  byId('travel').textContent = mine ? '협곡으로 이동' : '폐철광산으로 이동';
  byId('travel').disabled = game.wave > 0 || game.towers.some(Boolean);
  byId('rail').hidden = !mine;
  byId('rail').disabled = game.phase !== 'ready';
  byId('rail').textContent = '선로 ' + (track+1) + ' · 전환';
  byId('oreCount').textContent = '철광석 ' + forgeSave.ore + '개 · 화살촉 +' + forgeSave.level;
  const cost = 3 + forgeSave.level * 2;
  byId('forge').textContent = forgeSave.level === 5 ? '화살촉 최대 강화' : '화살촉 강화 · 철광석 ' + cost + '개';
  byId('forge').disabled = forgeSave.level >= 5 || forgeSave.ore < cost;
  byId('wave').textContent = game.wave + ' / ' + MAX_WAVE;
  byId('gold').textContent = game.gold;
  byId('health').textContent = game.hp;
  byId('best').textContent = '최고 기록 · ' + best + ' 웨이브 방어';
  byId('status').textContent = game.status;
  byId('speed').textContent = game.speed + '×';
  byId('pause').textContent = game.paused ? '계속하기' : '일시정지';
  byId('pause').disabled = game.phase !== 'running';
  byId('speed').disabled = game.phase === 'ended';
  byId('launch').disabled = game.phase !== 'ready';
  byId('launch').textContent = game.phase === 'ready' ? '웨이브 ' + (game.wave+1) + ' 시작'
    : game.phase === 'running' ? '웨이브 ' + game.wave + ' 진행 중' : '전투 종료';
  const progress = game.total ? (game.spawned-game.enemies.length)/game.total : 0;
  byId('progress').style.width = Math.max(0,progress*100) + '%';
  Object.entries(cards).forEach(([key, button]) => {
    button.setAttribute('aria-pressed',String(key === game.type && game.selected < 0));
    button.disabled = game.phase === 'ended';
  });
  padButtons.forEach((button,index) => {
    const tower = game.towers[index];
    button.setAttribute('aria-label',tower ? types[tower.type].name + ' 레벨 ' + tower.level + ' 선택' : '건설 지점 ' + (index+1));
    button.disabled = game.phase === 'ended';
  });
  renderDetail();
}

function renderDetail() {
  const tower = game.towers[game.selected];
  if (!tower) {
    const type = types[game.type];
    setDetailMarkup('<strong>' + type.name + '</strong> · ' + type.description + (game.type === 'arrow' ? ' · Lv.3 관통 쇠뇌' : '') + '<br>설치하려면 지도에서 +를 눌러.');
    return;
  }
  const cost = upgradeCost(tower);
  const refund = Math.floor(tower.paid*.65);
  setDetailMarkup('<strong>' + types[tower.type].name + ' Lv.' + tower.level + '</strong><div class="detail-actions">' +
    '<button type="button" class="quiet" id="upgrade"' + (tower.level === 3 || game.gold < cost || game.phase === 'ended' ? ' disabled' : '') + '>' +
    (tower.level === 3 ? '최대 레벨' : '강화 ' + cost + ' G') + '</button>' +
    '<button type="button" class="quiet" id="sell"' + (game.phase === 'ended' ? ' disabled' : '') + '>판매 ' + refund + ' G</button></div>');
  byId('upgrade').onclick = () => {
    if (tower.level >= 3 || game.gold < cost) return;
    game.gold -= cost;
    tower.paid += cost;
    tower.level++;
    game.status = types[tower.type].name + ' Lv.' + tower.level + ' 강화 완료';
    sync();
    (byId('upgrade').disabled ? byId('sell') : byId('upgrade')).focus();
  };
  byId('sell').onclick = () => {
    game.gold += refund;
    const index = game.selected;
    game.towers[index] = null;
    game.selected = -1;
    game.status = '타워를 판매하고 ' + refund + ' G를 받았어.';
    sync();
    padButtons[index].focus();
  };
}

function setDetailMarkup(markup) {
  if (markup === detailMarkup) return;
  detailMarkup = markup;
  detail.innerHTML = markup;
}

function upgradeCost(tower) {
  return Math.round(types[tower.type].cost*(tower.level === 1 ? .8 : 1.28));
}

function usePad(index) {
  if (game.phase === 'ended') return;
  if (game.towers[index]) {
    game.selected = index;
  } else {
    game.selected = -1;
    const type = types[game.type];
    if (game.gold >= type.cost) {
      game.gold -= type.cost;
      game.towers[index] = { type:game.type, level:1, paid:type.cost, cooldown:0, angle:-Math.PI/2 };
      game.selected = index;
      game.status = type.name + ' 설치 완료';
    } else {
      game.status = type.name + ' 설치에 ' + (type.cost-game.gold) + ' G가 더 필요해.';
    }
  }
  sync();
}

function startWave() {
  if (game.phase !== 'ready') return;
  game.wave++;
  const count = 6+game.wave;
  game.queue = Array.from({length:count},(_,index) => {
    if (index === count-1 && (game.wave === 5 || game.wave === 10)) return 'boss';
    if (game.wave >= 3 && (index+1)%4 === 0) return 'guard';
    if (game.wave >= 2 && (index+1)%3 === 0) return 'runner';
    return 'scout';
  });
  game.total = game.queue.length;
  game.spawned = 0;
  game.spawnTimer = 0;
  game.phase = 'running';
  game.status = game.wave === 5 || game.wave === 10 ? '보스가 마지막에 나타나!' : '적이 협곡에 들어왔어.';
  sync();
}

function position(distance) {
  const segment = segments.find(part => distance < part.start+part.length) || segments[segments.length-1];
  const ratio = Math.min(1,(distance-segment.start)/segment.length);
  return [segment.fromX+(segment.x-segment.fromX)*ratio,segment.fromY+(segment.y-segment.fromY)*ratio];
}

function finish(won) {
  game.phase = 'ended';
  game.paused = false;
  game.status = won ? '모든 웨이브를 방어했어.' : '요새가 함락됐어.';
  byId('resultTitle').textContent = won ? '요새 방어 성공!' : '요새 함락';
  byId('resultText').textContent = game.cleared + ' / ' + MAX_WAVE + ' 웨이브 방어';
  byId('overlay').hidden = false;
  sync();
  byId('restart').focus();
}

function tick(dt) {
  game.effects = game.effects.filter(effect => (effect.time -= dt) > 0);
  if (game.phase !== 'running') return;
  game.spawnTimer -= dt;
  if (game.queue.length && game.spawnTimer <= 0) {
    const key = game.queue.shift();
    const info = enemies[key];
    const hp = Math.round(info.hp*(1+(game.wave-1)*.21));
    game.enemies.push({key, hp, max:hp, progress:0, x:route[0][0], y:route[0][1], slow:0});
    game.spawned++;
    game.spawnTimer = Math.max(.43,.93-game.wave*.048);
  }
  let changed = false;
  for (const enemy of game.enemies) {
    const info = enemies[enemy.key];
    enemy.slow = Math.max(0,enemy.slow-dt);
    enemy.progress += info.speed*(enemy.slow ? .57 : 1)*dt;
    [enemy.x,enemy.y] = position(enemy.progress);
    if (enemy.progress >= routeLength) {
      game.hp = Math.max(0,game.hp-info.damage);
      game.status = '적이 요새에 도달했어!';
      changed = true;
    }
  }
  game.enemies = game.enemies.filter(enemy => enemy.progress < routeLength);
  if (!game.hp) { finish(false); return; }

  game.towers.forEach((tower,index) => {
    if (!tower) return;
    tower.cooldown = Math.max(0,tower.cooldown-dt);
    if (tower.cooldown > 0) return;
    const type = types[tower.type];
    const [x,y] = pads[index];
    const range = type.range+8*(tower.level-1);
    let target;
    for (const enemy of game.enemies) {
      if (enemy.hp <= 0 || Math.hypot(enemy.x-x,enemy.y-y) > range) continue;
      if (!target || enemy.progress > target.progress) target = enemy;
    }
    if (!target) return;
    const damage = type.damage*(1+.65*(tower.level-1))*(tower.type === 'arrow' ? 1+.15*forgeSave.level : 1);
    if (tower.type === 'arrow' && tower.level === 3) {
      const dx=target.x-x, dy=target.y-y, distance=Math.hypot(dx,dy)||1;
      for (const other of game.enemies) {
        if (other === target || other.hp<=0) continue;
        const ox=other.x-x, oy=other.y-y;
        const forward=(ox*dx+oy*dy)/distance;
        if (forward>0 && forward<range+60 && Math.abs(ox*dy-oy*dx)/distance<12) other.hp-=damage*.8;
      }
    }
    tower.cooldown = type.interval*(1-.09*(tower.level-1));
    tower.angle = Math.atan2(target.y-y,target.x-x);
    target.hp -= damage;
    if (tower.type === 'cannon') {
      for (const enemy of game.enemies) {
        if (enemy !== target && enemy.hp > 0 && Math.hypot(enemy.x-target.x,enemy.y-target.y) < 39) enemy.hp -= damage*.67;
      }
    }
    if (tower.type === 'frost') target.slow = 1.75;
    game.effects.push({x,y,tx:target.x,ty:target.y,color:type.color,time:.19,blast:tower.type === 'cannon'});
  });

  game.enemies = game.enemies.filter(enemy => {
    if (enemy.hp > 0) return true;
    game.gold += enemies[enemy.key].reward;
    changed = true;
    return false;
  });
  if (!game.queue.length && !game.enemies.length) {
    game.cleared = game.wave;
    const oreReward = mine ? (game.wave%5===0 ? 8 : 3) : 1;
    forgeSave.ore += oreReward;
    saveForge();
    if (game.wave > best) {
      best = game.wave;
      try { localStorage.setItem('greenwatch-best', String(best)); } catch {}
    }
    if (game.wave === MAX_WAVE) { finish(true); return; }
    const bonus = 23+game.wave*3;
    game.gold += bonus;
    game.phase = 'ready';
    game.status = '웨이브 ' + game.wave + ' 방어 성공 · 보너스 ' + bonus + ' G · 철광석 ' + oreReward + '개';
    changed = true;
  }
  if (changed) sync();
}

function trace(context) {
  context.beginPath();
  route.forEach(([x,y],index) => index ? context.lineTo(x,y) : context.moveTo(x,y));
}
function circle(context,x,y,r) {
  context.beginPath();
  context.arc(x,y,r,0,Math.PI*2);
}
function paintTerrain() {
  const ground = terrain.getContext('2d');
  const shade = ground.createLinearGradient(0,0,720,520);
  shade.addColorStop(0,'#345443');
  shade.addColorStop(.58,'#294838');
  shade.addColorStop(1,'#1c372d');
  ground.fillStyle = shade;
  ground.fillRect(0,0,720,520);

  let seed = 5225;
  function random() {
    seed = (Math.imul(seed,1664525)+1013904223) >>> 0;
    return seed/4294967296;
  }
  for (let i=0;i<650;i++) {
    const x = random()*720;
    const y = random()*520;
    ground.fillStyle = ['#254131','#40634c','#557256','#304f40'][i%4];
    ground.fillRect(x,y,2+random()*5,1+random()*3);
  }
  const groves = [[32,37],[240,41],[297,34],[646,58],[684,124],[50,304],[123,332],[232,399],[285,357],[678,341],[646,247],[88,459],[167,492],[272,489],[492,487],[697,492]];
  for (const [cx,cy] of groves) {
    for (let i=0;i<7;i++) {
      const x = cx+(random()-.5)*64;
      const y = cy+(random()-.5)*36;
      const size = 7+random()*10;
      ground.fillStyle = '#1a3027';
      circle(ground,x+4,y+5,size);
      ground.fill();
      ground.fillStyle = i%2 ? '#487855' : '#3d684e';
      ground.beginPath();
      ground.moveTo(x,y-size*1.25);
      ground.lineTo(x+size,y+size*.62);
      ground.lineTo(x-size,y+size*.62);
      ground.fill();
      ground.strokeStyle = '#64936a';
      ground.lineWidth = 1.5;
      ground.beginPath();
      ground.moveTo(x,y-size);
      ground.lineTo(x-size*.7,y+size*.39);
      ground.stroke();
    }
  }
  ground.lineJoin = 'round';
  for (const [width,color] of [[52,'#1c3029'],[42,'#726344'],[35,'#a0895e'],[30,'#917953']]) {
    trace(ground);
    ground.lineWidth = width;
    ground.strokeStyle = color;
    ground.stroke();
  }
  if (mine) {
    trace(ground); ground.strokeStyle='#373635'; ground.lineWidth=15; ground.stroke();
    trace(ground); ground.strokeStyle='#9e9984'; ground.lineWidth=10; ground.stroke();
    trace(ground); ground.strokeStyle='#50493d'; ground.lineWidth=6; ground.stroke();
  }
  for (let d=35;d<routeLength-30;d+=59) {
    const [x,y] = position(d);
    const [nextX,nextY] = position(d+3);
    ground.save();
    ground.translate(x,y);
    ground.rotate(Math.atan2(nextY-y,nextX-x));
    ground.strokeStyle = '#c1ab7a99';
    ground.lineWidth = 2;
    ground.beginPath();
    ground.moveTo(-4,-4);
    ground.lineTo(2,0);
    ground.lineTo(-4,4);
    ground.stroke();
    ground.restore();
  }
  for (const x of [-3,684]) {
    const y = x < 0 ? 97 : 421;
    ground.fillStyle = '#20332b';
    ground.fillRect(x,y-27,35,54);
    ground.strokeStyle = '#7e9181';
    ground.lineWidth = 3;
    ground.strokeRect(x+2,y-24,31,48);
    ground.fillStyle = '#aab6a0';
    ground.fillRect(x+2,y-24,31,7);
    ground.fillRect(x+2,y+17,31,7);
  }
}

function drawPad(index) {
  const [x,y] = pads[index];
  const tower = game.towers[index];
  const selected = index === game.selected;
  circle(ctx,x,y,23);
  ctx.fillStyle = '#23392e';
  ctx.fill();
  ctx.strokeStyle = selected ? '#def4a0' : '#7b987b';
  ctx.lineWidth = selected ? 3 : 1.8;
  ctx.stroke();
  if (!tower) {
    circle(ctx,x,y,17);
    ctx.strokeStyle = '#76967170';
    ctx.setLineDash([3,4]);
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#cae4b8';
    ctx.font = 'bold 23px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('+',x,y);
    return;
  }
  const type = types[tower.type];
  circle(ctx,x,y,15);
  ctx.fillStyle = '#1a2823';
  ctx.fill();
  ctx.strokeStyle = type.color;
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(tower.angle);
  ctx.fillStyle = type.color;
  if (tower.type === 'cannon') {
    ctx.fillRect(-6,-5,22,10);
    ctx.fillStyle = '#533e2a';
    ctx.fillRect(12,-3,4,6);
  } else if (tower.type === 'arrow') {
    ctx.fillRect(-8,-2,24,4);
    ctx.beginPath();
    ctx.moveTo(18,0);
    ctx.lineTo(9,-5);
    ctx.lineTo(9,5);
    ctx.fill();
    ctx.strokeStyle = type.color;
    ctx.beginPath();
    ctx.arc(-3,0,7,-Math.PI/2,Math.PI/2);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(14,0);
    ctx.lineTo(0,9);
    ctx.lineTo(-10,0);
    ctx.lineTo(0,-9);
    ctx.fill();
  }
  ctx.restore();
  for (let i=0;i<tower.level;i++) {
    circle(ctx,x+6*(i-(tower.level-1)/2),y+17,2);
    ctx.fillStyle = type.color;
    ctx.fill();
  }
}

function draw() {
  ctx.drawImage(terrain,0,0);
  const selected = game.towers[game.selected];
  if (selected) {
    const [x,y] = pads[game.selected];
    circle(ctx,x,y,types[selected.type].range+8*(selected.level-1));
    ctx.fillStyle = '#cded8b17';
    ctx.fill();
    ctx.strokeStyle = '#cde99a80';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  pads.forEach((_,index) => drawPad(index));
  for (const enemy of game.enemies) {
    const info = enemies[enemy.key];
    circle(ctx,enemy.x+2,enemy.y+4,info.radius);
    ctx.fillStyle = '#241d1880';
    ctx.fill();
    circle(ctx,enemy.x,enemy.y,info.radius);
    ctx.fillStyle = enemy.slow ? '#9cdfeb' : info.color;
    ctx.fill();
    ctx.strokeStyle = '#302d2a';
    ctx.lineWidth = enemy.key === 'boss' ? 3 : 2;
    ctx.stroke();
    circle(ctx,enemy.x+2,enemy.y-2,Math.max(2,info.radius*.29));
    ctx.fillStyle = '#714a46';
    ctx.fill();
    const width = info.radius*2+4;
    ctx.fillStyle = '#302527';
    ctx.fillRect(enemy.x-width/2,enemy.y-info.radius-7,width,3);
    ctx.fillStyle = '#ffcf9b';
    ctx.fillRect(enemy.x-width/2,enemy.y-info.radius-7,width*enemy.hp/enemy.max,3);
  }
  for (const effect of game.effects) {
    ctx.save();
    ctx.globalAlpha = Math.min(1,effect.time*6);
    ctx.strokeStyle = effect.color;
    ctx.lineWidth = effect.blast ? 3 : 2;
    ctx.beginPath();
    ctx.moveTo(effect.x,effect.y);
    ctx.lineTo(effect.tx,effect.ty);
    ctx.stroke();
    circle(ctx,effect.tx,effect.ty,effect.blast ? 9+(1-effect.time/.19)*28 : 3);
    ctx.stroke();
    ctx.restore();
  }
}

function frame(now) {
  const wallTime = Math.min(.05,(now-lastFrame)/1000);
  lastFrame = now;
  if (!game.paused) {
    elapsed += wallTime*game.speed;
    while (elapsed >= 1/60) {
      tick(1/60);
      elapsed -= 1/60;
    }
    draw();
  }
  requestAnimationFrame(frame);
}

for (const [key,type] of Object.entries(types)) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'card';
  button.style.setProperty('--tower',type.color);
  button.innerHTML = '<span class="icon" aria-hidden="true">' + type.icon + '</span><span><b>' + type.name +
    '</b><small>' + type.description + '</small></span><strong class="price">' + type.cost + ' G</strong>';
  button.onclick = () => {
    game.type = key;
    game.selected = -1;
    sync();
    draw();
  };
  byId('cards').append(button);
  cards[key] = button;
}
pads.forEach(([x,y],index) => {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'pad';
  button.style.left = x/7.2 + '%';
  button.style.top = y/5.2 + '%';
  button.onclick = () => { usePad(index); draw(); };
  byId('pads').append(button);
  padButtons.push(button);
});
function changeMap() {
  buildRoute(); paintTerrain(); sync(); draw();
}
byId('travel').onclick = () => {
  if (game.wave || game.towers.some(Boolean)) return;
  mine=!mine; track=0;
  game.status=mine ? '폐철광산 · 웨이브마다 철광석을 캐. 전투 전에 선로를 바꿀 수 있어.' : '녹안 협곡에 도착했어.';
  changeMap();
};
byId('rail').onclick = () => {
  if (!mine || game.phase !== 'ready') return;
  track=1-track; changeMap();
};
byId('forge').onclick = () => {
  const cost=3+forgeSave.level*2;
  if (forgeSave.level>=5 || forgeSave.ore<cost) return;
  forgeSave.ore-=cost; forgeSave.level++; saveForge();
  game.status='화살촉 강화 성공 · 모든 활탑 피해 +' + (15*forgeSave.level) + '%';
  sync();
};
byId('launch').onclick = startWave;
byId('restart').onclick = () => { reset(); draw(); cards.arrow.focus(); };
byId('speed').onclick = () => { game.speed = game.speed === 3 ? 1 : game.speed+1; sync(); };
byId('pause').onclick = () => {
  game.paused = !game.paused;
  game.status = game.paused ? '전투를 일시정지했어.' : '전투를 다시 시작했어.';
  sync();
};
paintTerrain();
reset();
draw();
requestAnimationFrame(frame);
</script>
</body>
